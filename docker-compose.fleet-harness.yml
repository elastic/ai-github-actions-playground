# Fleet Server harness — real Fleet Server + enrolled Elastic Agents
# Produces: metrics-fleet_server.*, logs-fleet_server.*, logs-elastic_agent-*, metrics-elastic_agent.*
#
# Usage:
#   make fleet-harness-up     # start everything (3-5 min to initialize)
#   make fleet-harness-down   # stop and remove
#   make fleet-harness-logs   # tail fleet-server logs
#
# Ports: ES=9220, Kibana=5601, Fleet Server=8220
# Credentials: elastic / changeme

services:
  fleet-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=changeme
      - xpack.security.authc.api_key.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.license.self_generated.type=trial
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9220:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:changeme http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - fleet-es-data:/usr/share/elasticsearch/data

  fleet-kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    environment:
      - ELASTICSEARCH_HOSTS=http://fleet-elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=changeme
      - XPACK_SECURITY_ENCRYPTIONKEY=something-at-least-32-characters-long!!
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=something-at-least-32-characters-long!!
      - XPACK_REPORTING_ENCRYPTIONKEY=something-at-least-32-characters-long!!
      # Fleet auto-configuration
      - XPACK_FLEET_AGENTS_FLEET_SERVER_HOSTS=["http://fleet-server:8220"]
      - XPACK_FLEET_AGENTS_ELASTICSEARCH_HOSTS=["http://fleet-elasticsearch:9200"]
      # Pre-create Fleet Server and default agent policies with monitoring enabled
      - XPACK_FLEET_PACKAGES=[{"name":"fleet_server","version":"latest"},{"name":"system","version":"latest"},{"name":"elastic_agent","version":"latest"}]
      - XPACK_FLEET_AGENTPOLICIES=[{"name":"Fleet Server Policy","id":"fleet-server-policy","namespace":"default","monitoring_enabled":["logs","metrics"],"package_policies":[{"name":"fleet_server-1","package":{"name":"fleet_server"}}]},{"name":"Default Agent Policy","id":"default-agent-policy","namespace":"default","monitoring_enabled":["logs","metrics"],"is_default":true,"package_policies":[{"name":"system-1","package":{"name":"system"}}]}]
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q available || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
    depends_on:
      fleet-elasticsearch:
        condition: service_healthy

  fleet-server:
    image: docker.elastic.co/beats/elastic-agent:8.17.0
    environment:
      - FLEET_SERVER_ENABLE=1
      - FLEET_SERVER_POLICY_ID=fleet-server-policy
      - FLEET_SERVER_ELASTICSEARCH_HOST=http://fleet-elasticsearch:9200
      - FLEET_SERVER_ELASTICSEARCH_USERNAME=elastic
      - FLEET_SERVER_ELASTICSEARCH_PASSWORD=changeme
      - FLEET_SERVER_HOST=0.0.0.0
      - FLEET_SERVER_PORT=8220
      - FLEET_SERVER_INSECURE_HTTP=true
      - KIBANA_HOST=http://fleet-kibana:5601
      - KIBANA_FLEET_SETUP=1
    ports:
      - "8220:8220"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8220/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    depends_on:
      fleet-kibana:
        condition: service_healthy

  fleet-setup:
    image: curlimages/curl:8.12.1
    volumes:
      - fleet-shared:/shared
      - ./docker/fleet-setup/setup.sh:/setup.sh:ro
    command: ["/bin/sh", "/setup.sh"]
    depends_on:
      fleet-server:
        condition: service_healthy

  elastic-agent-1:
    image: docker.elastic.co/beats/elastic-agent:8.17.0
    hostname: agent-host-01
    environment:
      - FLEET_ENROLL=1
      - FLEET_URL=http://fleet-server:8220
      - FLEET_INSECURE=true
      - KIBANA_HOST=http://fleet-kibana:5601
    volumes:
      - fleet-shared:/shared:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for enrollment token..."
        until [ -f /shared/enrollment-token ]; do sleep 5; done
        export FLEET_ENROLLMENT_TOKEN=$$(cat /shared/enrollment-token)
        echo "Enrolling with token: $${FLEET_ENROLLMENT_TOKEN:0:20}..."
        exec /usr/bin/elastic-agent container
    depends_on:
      fleet-setup:
        condition: service_completed_successfully

  elastic-agent-2:
    image: docker.elastic.co/beats/elastic-agent:8.17.0
    hostname: agent-host-02
    environment:
      - FLEET_ENROLL=1
      - FLEET_URL=http://fleet-server:8220
      - FLEET_INSECURE=true
      - KIBANA_HOST=http://fleet-kibana:5601
    volumes:
      - fleet-shared:/shared:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for enrollment token..."
        until [ -f /shared/enrollment-token ]; do sleep 5; done
        export FLEET_ENROLLMENT_TOKEN=$$(cat /shared/enrollment-token)
        echo "Enrolling with token: $${FLEET_ENROLLMENT_TOKEN:0:20}..."
        exec /usr/bin/elastic-agent container
    depends_on:
      fleet-setup:
        condition: service_completed_successfully

volumes:
  fleet-es-data:
  fleet-shared:
