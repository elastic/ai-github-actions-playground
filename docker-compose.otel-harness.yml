services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=trial
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  otel-collector:
    image: docker.elastic.co/elastic-agent/elastic-agent:9.3.0
    command: ["otel", "--config=file:/etc/otelcol/config.yaml"]
    environment:
      - ES_URL=${ES_URL:-http://elasticsearch:9200}
      - ES_API_KEY=${ES_API_KEY:-}
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro
    pid: host
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:13133/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      elasticsearch:
        condition: service_healthy

  otelgen-traces:
    image: ghcr.io/krzko/otelgen:v0.5.2
    command:
      - --otel-exporter-otlp-endpoint=otel-collector:4317
      - --insecure
      - --rate=5
      - --duration=86400
      - traces
      - multi
    depends_on:
      otel-collector:
        condition: service_healthy

  otelgen-logs:
    image: ghcr.io/krzko/otelgen:v0.5.2
    command:
      - --otel-exporter-otlp-endpoint=otel-collector:4317
      - --insecure
      - --rate=5
      - --duration=86400
      - logs
      - multi
    depends_on:
      otel-collector:
        condition: service_healthy

  fleet-agents-sim:
    image: curlimages/curl:8.12.1
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        until curl -sf http://elasticsearch:9200 >/dev/null; do sleep 2; done
        while true; do
          now="$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat <<EOF >/tmp/fleet-agents.ndjson
        {"index":{"_index":"fleet-agents-sim","_id":"agent-edge-01"}}
        {"agent":{"id":"agent-edge-01"},"active":true,"policy_id":"linux-prod","last_checkin_status":"online","last_checkin":"$$now","enrolled_at":"$$now","local_metadata":{"host":{"hostname":"edge-01"}}}
        {"index":{"_index":"fleet-agents-sim","_id":"agent-edge-02"}}
        {"agent":{"id":"agent-edge-02"},"active":true,"policy_id":"linux-prod","last_checkin_status":"degraded","last_checkin":"$$now","enrolled_at":"$$now","local_metadata":{"host":{"hostname":"edge-02"}}}
        {"index":{"_index":"fleet-agents-sim","_id":"agent-edge-03"}}
        {"agent":{"id":"agent-edge-03"},"active":false,"policy_id":"windows-staging","last_checkin_status":"offline","last_checkin":"$$now","enrolled_at":"$$now","local_metadata":{"host":{"hostname":"edge-03"}}}
        EOF
          curl -fsS -X POST "http://elasticsearch:9200/_bulk?refresh=true" \
            -H "content-type: application/x-ndjson" \
            --data-binary @/tmp/fleet-agents.ndjson >/dev/null
          sleep 30
        done
    depends_on:
      elasticsearch:
        condition: service_healthy
