# Replay overlay: starts ES + collector in replay mode (OTLP/HTTP on 4318).
# No generators — the replay script sends captured fixture data.
#
# Usage:
#   # Start ES + collector
#   docker compose -f docker-compose.otel-es.yml -f docker-compose.otel-replay.yml up -d
#
#   # Replay fixtures (from host)
#   cd peek && node scripts/otel-replay.mjs
#
#   # Seed non-OTLP data (web_logs, orders, ingest pipelines)
#   cd peek && node scripts/seed-elasticsearch.mjs --url http://localhost:9200
services:
  otel-collector:
    image: docker.elastic.co/elastic-agent/elastic-agent:9.3.0
    command: ["otel", "--config=/etc/otelcol/config.yaml"]
    environment:
      - ES_URL=http://elasticsearch:9200
      - ES_API_KEY=
    volumes:
      - ./docker/otel-collector/config-replay.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:13133/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      elasticsearch:
        condition: service_healthy
