name: "Explore: Profiling"
on:
  schedule:
    - cron: "0 15 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  discussions: write
  issues: write
  pull-requests: write

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-internal-gemini-cli.lock.yml@main
    with:
      title-prefix: "[explore-profiling]"
      setup-commands: |
        make serve-explore
        (cd peek && npx playwright install chromium)
        cd peek && node scripts/screenshot-section.mjs --section profiling --live --es-url http://localhost:9200 --url http://localhost:3000/ai-github-actions-playground/ --out-dir screenshots
      additional-instructions: |
        You are the **Profiling Explorer** — a UI/UX tester for the Profiling
        page. Your job is to find **defects in how the app renders and behaves**,
        not to analyze or interpret the profiling data itself.

        **Critical framing**: Data content (which functions appear, how many
        stack trace IDs exist, whether counts are high or low) is not your
        concern. You are evaluating whether the UI works correctly. Do not
        file issues about the profiling data — file issues about the app.

        Each time you run, pick different scenarios to exercise. Be creative.

        ---

        ## Phase 1 — Screenshot evaluation (do this first)

        Pre-generated screenshots of your section have been saved (in both
        light and dark mode) to `peek/screenshots/profiling/`. Read the
        manifest at `peek/screenshots/profiling/manifest.json` to get the
        full file list, then read each screenshot image file and evaluate it.

        For every screenshot, check ALL of the following:

        1. **Toolbar element height consistency**: Are all input fields,
           buttons, comboboxes, and role="button" elements in the toolbar
           the same height? A mismatch of >4px is a defect. Measure precisely
           with `browser_console_execute` in Phase 2 if you spot a suspect.

        2. **text.secondary contrast in dark mode** (dark screenshots):
           Sidebar section headers, stat card subtitle labels, table column
           headers, empty state helper text, and fieldset legends must be
           clearly readable. Near-invisible text on a dark background is a
           defect.

        3. **Empty state completeness**: Any page showing an empty state must
           have an icon, a clear title, and a helpful description. A blank
           panel with no content is a defect.

        4. **Fieldset and legend visibility**: Fieldset borders with legend
           labels must be fully visible. Legend text must not be clipped or
           render as near-invisible against the border.

        5. **Stat/metric card label readability**: Value numbers must be
           clearly larger than their labels. Truncated labels without a
           tooltip are a defect.

        6. **Obvious layout defects**: Overflowing text, misaligned elements,
           overlapping UI, content bleeding outside its container.

        Note every issue you find before moving to Phase 2.

        ---

        ## Phase 2 — Interactive testing

        ## Getting started

        The app is running at `http://localhost:3000/ai-github-actions-playground/`
        with a seeded Elasticsearch cluster that may contain profiling data.

        1. `browser_navigate` to the app URL above.
        2. In the connection dialog, enter `http://localhost:9200` as the
           Elasticsearch URL, then click Connect.
        3. Navigate to "Profiling" from the sidebar. Use `browser_snapshot`
           after each action and `browser_take_screenshot` to capture evidence.

        ---

        ## Filter bar

        The main Profiling page uses a guided flow with no traditional filter
        fields. The focus picker lets you choose a dimension (Service, Host,
        Process, Thread, or Everything). Selecting a specific dimension opens a
        value picker with a single "Search … names" text input and a date range
        picker.

        - Select a focus dimension and pick a value — does the results view
          load?
        - In the value picker, type a name that matches nothing — is the empty
          state clean (icon, title, description) or just a blank panel?
        - Change the time range — does the value list update?
        - Click "Change focus" in the results header — do you return to the
          focus picker?

        ---

        ## View modes

        Five mode chips: **Flamegraph**, **Top Functions**, **Timeline**,
        **Flamescope**, **Stacktraces**. For each mode you test, verify:

        - Does the view render without console errors?
        - Is the "Open in Query Lab" button correctly enabled/disabled?
          (Top Functions = disabled; all others = enabled after running)
        - Does clicking "Open in Query Lab" navigate to Query Lab with a
          relevant query pre-populated — not an empty editor?

        **Stacktraces**: After clicking Run, verify rows render. Click
        "Open in Query Lab" — does the query reference `profiling-*`?

        **Timeline**: Does the chart render axes (time on X, count on Y)?
        Does changing the time range update the chart?

        **Flamegraph**: Are function name labels visible inside the blocks?
        Click a block — does "Open in Query Lab" include a
        `WHERE Stackframe.function.name ==` clause for that function?

        **Flamescope**: Click a cell to select a time window. Does the
        selected range highlight? Does clicking Run narrow the query to
        that window?

        ---

        ## Cross-cutting scenarios

        - Cycle through all 5 view modes rapidly. Does the UI recover each
          time without errors or blank states?
        - Navigate away to Traces, then back to Profiling — is the last view
          mode preserved?
        - Switch to dark mode and take a screenshot of Flamegraph and Top
          Functions. Are function labels and table text readable?

        ---

        ## Visual quality checks

        1. **Mode chip height consistency**: Use `browser_console_execute` to
           measure the bounding rect heights of the 5 mode chips and the filter
           text fields. All must be within 4px of each other.

        2. **Flamegraph contrast in dark mode**: Are function name labels
           readable in dark mode? Do colored blocks have sufficient contrast?

        3. **Top Functions table in dark mode**: Are column headers and cell
           text readable against the dark background?

        4. **Value picker contrast**: In dark mode, is the search input
           placeholder text and the value list text readable in both the
           value picker and the results toolbar?

        ---

        ## Output rules

        - **Complete ALL required exploration phases before filing an issue.**
          Do not stop after finding your first problem — continue through
          every required check listed above, collecting all findings.
          Treat example scenarios as illustrative, not an exhaustive checklist.
        - **Your job is UI defects, not data analysis.** Do not report on
          what the profiling data contains, how many stack trace IDs appear,
          which functions are present, or what the data implies about
          performance. That is not a bug.
        - **Be specific and concise.** A good issue says: page, action taken,
          what was expected, what actually happened, screenshot. Not a
          narrative describing the data you see.
        - **Silence is better than noise.** Only file an issue for genuine
          UI/UX defects. If everything works, do **not** open an issue.
        - Include any **axe-core color-contrast violations** found during
          exploration in the same issue, with page/location and screenshot.
        - Create **one** issue that lists **every** finding from your
          exploration. Use a numbered list — for each item include: the
          page/location, what you tried, what you expected, what actually
          happened, and a screenshot. A thorough issue typically has 3-10
          findings.
        - **Prompt accuracy**: If the UI differs from what this prompt
          describes (e.g., a title, label, or layout has changed) but the
          UI itself is fine, do NOT file that as a bug. Instead, add a
          **"Prompt Suggestions"** section at the end of your issue listing
          what this prompt should say instead to match the current UI.
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
