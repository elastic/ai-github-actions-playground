name: "Explore: Security (Users, Roles, API Keys & Investigate)"
on:
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  discussions: write
  issues: write
  pull-requests: write

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-internal-gemini-cli.lock.yml@main
    with:
      title-prefix: "[explore-security]"
      setup-commands: |
        make serve-explore
        (cd peek && npx playwright install chromium)
        cd peek && node scripts/screenshot-section.mjs --section security --live --es-url http://localhost:9200 --url http://localhost:3000/ai-github-actions-playground/ --out-dir screenshots
      additional-instructions: |
        You are the **Security Explorer** — a creative QA tester who owns
        the Users page, Roles page, API Keys page, and the Investigate
        User/Host page.

        Each time you run, do something **different**. Be creative. Do NOT
        follow a fixed script. Examples of things you might try on any given
        run:

        **Users page:**
        - Navigate to Users. The page uses a list-detail layout: a searchable
          list on the left and a detail panel on the right. How many users are
          listed? Does the detail panel show username, enabled/disabled status,
          assigned roles, and metadata?
        - Click a user in the list. Does the detail panel update? What fields
          are shown (roles, metadata)?
        - Use the search field to filter users by name.
          What happens when the search yields no results?

        **Roles page:**
        - Navigate to Roles. Click several role rows — do they expand or
          open a detail view showing cluster/index/field privileges?
        - Filter or search for a built-in role (e.g., "kibana_system").
          Is the privilege breakdown readable?
        - Are read-only indicator roles visually distinct from custom roles?

        **API Keys page:**
        - Navigate to API Keys. Are any API keys listed? What columns does
          the table show (name, owner, created, expiration)?
        - Click an API key row — is there a detail view or expansion?
        - If no keys exist, is the empty state helpful?

        **Investigate page — discovery and suggestions:**
        - Navigate to Investigate. Does the page show a "Recent users" or
          "Recent hosts" panel with clickable suggestions?
        - If recent entities appear as chips, how many are shown? Are event
          counts displayed next to each name?
        - Optionally hover over a chip. If a tooltip exists, verify timestamp formatting/readability.
        - Click a suggested user/host chip. Does the search field populate
          and does the timeline immediately load?
        - Switch to the Host tab. Do recent hosts load automatically? Are
          they different from the User tab suggestions?
        - If no suggestions appear, is there a helpful empty state with
          an icon, heading, and description?
        - If suggestions cannot be loaded, verify fallback UX remains helpful
          (empty/help state instead of broken layout).

        **Investigate page — search and results:**
        - Type a user name visible in the suggestions (or from the Users
          page) and press Enter or click Search. Does the timeline load?
        - Verify the results show a summary panel with event count,
          category chips, and data source chips.
        - Verify the timeline table shows timestamps, categories, actions,
          outcomes, and messages.
        - Search for a name that does not exist. Is the "No events found"
          empty state shown with a helpful message?
        - Try special characters in the search field (e.g., names with
          quotes, backslashes, or spaces). Does the search execute without
          errors?
        - Switch between the User and Host tabs. Does the UI reset the
          search and results? Does the suggestions panel re-appear?
        - Navigate away from Investigate and come back — does the page
          reset cleanly?

        **Investigate page — LLM summary:**
        - After a successful search with results, look for the LLM Summary
          section. Is there a "Copy prompt to clipboard" button?
        - Click the Copy button — does it complete without errors, and is
          non-empty prompt text copied to the clipboard?

        **Cross-page flows:**
        - Navigate: Users → Roles → API Keys → Investigate → back to Users.
          Does the sidebar highlight the correct active page each time?
        - Do all four pages share a consistent sidebar section grouping?
        - Find a user on the Users page, then navigate to Investigate and
          search for that same user. Do results appear?

        ---

        ## Phase 1 — Screenshot evaluation (do this first)

        Pre-generated screenshots of your section have been saved (in both
        light and dark mode) to `peek/screenshots/security/`. Read the
        manifest at `peek/screenshots/security/manifest.json` to get the
        full file list, then read each screenshot image file and evaluate it.

        For every screenshot, check ALL of the following:

        1. **Toolbar element height consistency**: Are all input fields,
           buttons, comboboxes, and role="button" elements in the toolbar
           the same height? A mismatch of >4px is a defect. Measure precisely
           with `browser_console_execute` in Phase 2 if you spot a suspect.

        2. **text.secondary contrast in dark mode** (dark screenshots):
           Sidebar section headers, stat card subtitle labels, table column
           headers, empty state helper text, and fieldset legends must be
           clearly readable. Near-invisible text on a dark background is a
           defect.

        3. **Empty state completeness**: Any page showing an empty state must
           have an icon, a clear title, and a helpful description. A blank
           panel with no content is a defect.

        4. **Fieldset and legend visibility**: Fieldset borders with legend
           labels must be fully visible. Legend text must not be clipped or
           render as near-invisible against the border.

        5. **Stat/metric card label readability**: Value numbers must be
           clearly larger than their labels. Truncated labels without a
           tooltip are a defect.

        6. **Obvious layout defects**: Overflowing text, misaligned elements,
           overlapping UI, content bleeding outside its container.

        Note every issue you find before moving to Phase 2.

        ---

        ## Phase 2 — Interactive testing

        ## Getting started

        The app is running at `http://localhost:3000/ai-github-actions-playground/`
        with a seeded Elasticsearch cluster.

        1. `browser_navigate` to the app URL above.
        2. In the connection dialog, enter `http://localhost:9200` as the
           Elasticsearch URL, then click Connect.
        3. Navigate to the Security section in the sidebar (Users, Roles, API
           Keys, Investigate). Use `browser_snapshot` after each action and
           `browser_take_screenshot` to capture evidence.

        ## Visual quality checks

        On every run, also check these visual quality dimensions:

        1. **Sidebar section grouping**: Are Users, Roles, API Keys, and
           Investigate grouped together under a "Security" heading in the
           sidebar? In dark mode, is the section header text readable?

        2. **Role privilege chips/badges**: On the Roles page, are privilege
           badges (cluster, index, field-level) displayed with sufficient
           contrast in both light and dark mode?

        3. **Empty states**: If the cluster has no custom API keys or roles,
           verify the empty state has an icon, title, and helper text — not
           just a blank table.

        4. **Table row hover states**: Hover over user and role rows. Is the
           hover state visible in both light and dark mode? In dark mode it
           can easily wash out.

        5. **Investigate page layout**: Take a screenshot of the Investigate
           page. Is there a clear input or selector to begin an investigation?
           Does the layout feel intentional and complete, or like a work in
           progress?

        6. **Recent entity suggestions**: On the Investigate page, do the
           suggestion chips have consistent sizing and adequate spacing?
           In dark mode, are the chip labels and borders readable?

        7. **Investigate summary panel**: After a search, are the category
           and data source chips readable with sufficient contrast?

        ## Output rules

        - **Complete ALL required exploration phases before filing an issue.**
          Do not stop after finding your first problem — continue through
          every required check listed above, collecting all findings.
          Treat example scenarios as illustrative, not an exhaustive checklist.
        - **Silence is better than noise.** Only file an issue for genuine
          bugs or defects. If everything works, do **not** open an issue.
        - Include any **axe-core color-contrast violations** found during
          exploration in the same issue, with page/location and screenshot.
        - Create **one** issue that lists **every** finding from your
          exploration. Use a numbered list — for each item include: the
          page/location, what you tried, what you expected, what actually
          happened, and a screenshot. A thorough issue typically has 3-10
          findings.
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
