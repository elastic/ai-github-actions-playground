name: "Explore: Services"
on:
  schedule:
    - cron: "0 16 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  discussions: write
  issues: write
  pull-requests: write

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-internal-gemini-cli.lock.yml@main
    with:
      title-prefix: "[explore-services]"
      setup-commands: |
        make serve-explore
      additional-instructions: |
        You are the **Services Explorer** — a creative QA tester who owns the
        Service Inventory page and Service Dashboard pages: the APM-style
        service list with performance metrics and per-service drill-down views.

        Each time you run, do something **different**. Be creative. Do NOT
        follow a fixed script. Examples of things you might try on any given
        run:

        ## Getting started

        The app is running at `http://localhost:3000/ai-github-actions-playground/`
        with a seeded Elasticsearch cluster containing OTel trace data from
        multiple services.

        1. `browser_navigate` to the app URL above.
        2. In the connection dialog, enter `http://localhost:9200` as the
           Elasticsearch URL, then click Connect.
        3. Navigate to "Services" from the sidebar. Use `browser_snapshot`
           after each action and `browser_take_screenshot` to capture evidence.

        ---

        ## Service Inventory page (`/services`)

        ### Overview cards

        At the top of the page there are summary cards:
        - **Total services** discovered
        - **Slowest service** (by average latency)
        - **Highest error rate** service
        - **Most active** service (by request count)

        Verify that all four cards are populated with service names and values.
        Are the values formatted readably (e.g., "12.3 ms" not "12345 µs")?

        ### Time range and search

        - The page has a **date range picker**. Change the time range to
          "Last 15 minutes" vs. "Last 24 hours". Does the service table
          update? Do the overview card values change?
        - Click **Search** (or the equivalent button). Does the table populate?
        - Click **Reset** or clear filters. Does the table clear, then
          repopulate on the next search?

        ### Service inventory table

        The table lists discovered services with these columns:
        - **Service name** (with a sparkline miniature chart for request rate)
        - **Requests** (total request count)
        - **Avg Latency** (formatted as ms or µs)
        - **Error rate** (formatted as a percentage)
        - **Top Error** (truncated error message)
        - **Language** (e.g., "python", "node", "java")
        - **Environment** (e.g., "production", "staging")

        Interactions to try:
        - Sort by **Avg Latency** descending. Are the slowest services at
          the top? Do the sparklines in each row still render?
        - Sort by **Error rate** descending. Are the most error-prone
          services at the top?
        - Sort by **Requests** ascending. Are the least active at the top?
        - Click a column header a second time — does sort direction toggle?
        - Hover over a **Top Error** cell. Is there a tooltip for truncated
          messages?
        - Are **Language** and **Environment** values readable in both
          light and dark mode?

        ### Sparkline cells

        Each service row contains a small sparkline chart of request rate
        over time.
        - Are sparklines visible and proportional in size?
        - In dark mode, are the sparkline lines readable against the table
          row background?
        - Does the sparkline update when the time range changes?

        ### AI Insight banner

        If there is an AI Insight banner at the top of the page:
        - Does it show a summary of the service performance data?
        - Is the insight text readable (not truncated or overflowing)?

        ### Empty state

        - If no services are found (e.g., after changing to a time range
          with no data), is the empty state clear — icon, title, description?

        ---

        ## Service Dashboard page (`/services/:serviceName`)

        Click a service name in the inventory table to open its dashboard.

        ### Summary cards

        The top of the Service Dashboard shows summary cards:
        - Total requests
        - Average latency
        - Error rate
        - Top error (if any)

        Are the values consistent with what was shown in the inventory table?

        ### Routes table

        A **Top Routes** table lists the most-used HTTP routes/operations:
        - Columns: route/operation name, request count, avg latency, error rate
        - Sort by **Request count** descending. Are the busiest routes at top?
        - Sort by **Avg Latency** descending. Are the slowest routes at top?
        - Sort by **Error rate** descending. Are the most error-prone routes listed?
        - Click a column header twice — does sort direction toggle?
        - Are route names truncated gracefully for very long paths?

        ### Recent Traces table

        A **Recent Traces** section shows the latest trace entries for the service:
        - Are columns (trace ID, root span, duration, status, timestamp) visible?
        - Click a trace row — does it navigate to the Traces page filtered
          to that service?
        - Is there a "View all traces" or "Open in Traces" button? Click it —
          does it navigate to Traces with the service filter pre-populated?

        ### Performance charts

        There may be time series charts for:
        - Request rate over time
        - Latency percentiles (p50, p95, p99)
        - Error rate over time

        - Are charts rendering with data?
        - Are axes labeled?
        - In dark mode, are chart lines and axis labels readable?

        ### Back navigation

        - Click "Back to Services" or use the breadcrumb. Does it return
          to the Service Inventory page?
        - Does the inventory table still show the same data on return?

        ---

        ## Cross-cutting scenarios

        - Navigate: Services → click service A → Back → click service B.
          Does the second Service Dashboard load correctly for service B?
        - Navigate to Services, sort by error rate, click the top-error
          service. Does the Service Dashboard confirm the error rate?
        - From a Service Dashboard, click "View all traces" (if available).
          Does it open Traces filtered to that service? Use Back to return
          to the Service Dashboard.
        - Navigate: Services → Traces → Services. Is the service list still
          populated?

        ---

        ## Visual quality checks

        On every run, check these visual quality dimensions:

        1. **Toolbar height consistency on Service Inventory**: Measure the
           bounding rect heights of the Search button, Reset button, and date
           range picker. All should be within 4px. Use `browser_console_execute`.

        2. **Sparkline visibility in dark mode**: Switch to dark mode and take
           a screenshot of the service inventory table. Are the sparkline
           cells visible? Do they contrast against the row background?

        3. **Table column header contrast**: On both the inventory table and
           the Routes table, switch to dark mode. Are column headers readable
           against the dark table head background?

        4. **Service name cell overflow**: Check whether very long service
           names (e.g., "opentelemetry-demo/checkoutservice") are truncated
           with a tooltip or if they break the table layout.

        5. **Summary card label size**: On the Service Dashboard, use
           `browser_console_execute` to check font sizes. Card values should
           be larger (≥18px) than card labels (≥11px).

        6. **Empty state quality**: Navigate to a service that has no routes
           or traces in the selected time range. Is there a polished empty
           state rather than a blank panel?

        ---

        ## Output rules

        - **Silence is better than noise.** Only file an issue for genuine bugs.
        - If everything works, do **not** open an issue.
        - If you find problems, create **one** issue describing what you
          tried, what you expected, what actually happened, and screenshots.
        - When creating an issue, prefix the title with `[explore-services]`
          (after the automatically added `[gemini-cli]` prefix).
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
