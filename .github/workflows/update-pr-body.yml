name: Update PR Body
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  copilot-requests: write
  issues: read
  pull-requests: write

jobs:
  run:
    if: >-
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
      contains(fromJSON('["Copilot","dependabot[bot]","github-actions[bot]"]'), github.event.pull_request.user.login)) &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'no-update-pr-body')
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-update-pr-body.lock.yml@main
    with:
      model: gemini-3-flash
      additional-instructions: |
        Strip any "original prompt" or raw issue prompt text from the PR body.
        Keep the PR body clean and concise, focusing on what changed and why.
        Ensure the PR body follows the repository's PR template structure.
