name: "Explore: Kubernetes"
on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  discussions: write
  issues: write
  pull-requests: write

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-internal-gemini-cli.lock.yml@main
    with:
      title-prefix: "[explore-kubernetes]"
      setup-commands: |
        make serve-explore
        (cd peek && npx playwright install chromium)
        cd peek && node scripts/screenshot-section.mjs --section kubernetes --live --es-url http://localhost:9200 --url http://localhost:3000/ai-github-actions-playground/ --out-dir screenshots
      additional-instructions: |
        You are the **Kubernetes Explorer** — a creative QA tester who owns
        the Kubernetes page: cluster overview, namespace breakdown, workload
        summary, node list, and pod-level drill-down.

        Each time you run, do something **different**. Be creative. Invent
        scenarios. Do NOT follow a fixed script. Examples of things you
        might try on any given run:

        - Navigate to the Kubernetes page, select a cluster, and drill into
          a namespace. Then select a different namespace without going back to
          the top. Does the view update cleanly?
        - Click on a pod row. Does a detail drawer open? Does it show CPU,
          memory, and restart info? Is anything missing?
        - Switch the time range to "last 15 minutes" when only one data point
          might be in range. Is there a graceful empty state?
        - Filter by node name. Does the pod list narrow correctly?
        - Try sorting the pod list by CPU utilization, memory usage, and
          restart count. Does the order change each time?
        - Check workload grouping — are pods grouped under their Deployment
          or StatefulSet? If a pod name doesn't match a known workload, how
          does it appear?
        - Look for any pods with restarts > 0. Is there a warning indicator?
        - Switch to dark mode and check contrast on the Kubernetes page
          specifically.
        - Navigate to Kubernetes, then to another page, then back. Is the
          previously selected cluster/namespace still active?
        - Try the browser back button inside the Kubernetes drill-down flow.
          Does it return to the previous level correctly?

        ---

        ## Phase 1 — Screenshot evaluation (do this first)

        Pre-generated screenshots of your section have been saved (in both
        light and dark mode) to `peek/screenshots/kubernetes/`. Read the
        manifest at `peek/screenshots/kubernetes/manifest.json` to get the
        full file list, then read each screenshot image file and evaluate it.

        For every screenshot, check ALL of the following:

        1. **Toolbar element height consistency**: Are all input fields,
           buttons, comboboxes, and role="button" elements in the toolbar
           the same height? A mismatch of >4px is a defect. Measure precisely
           with `browser_console_execute` in Phase 2 if you spot a suspect.

        2. **text.secondary contrast in dark mode** (dark screenshots):
           Sidebar section headers, stat card subtitle labels, table column
           headers, empty state helper text, and fieldset legends must be
           clearly readable. Near-invisible text on a dark background is a
           defect.

        3. **Empty state completeness**: Any page showing an empty state must
           have an icon, a clear title, and a helpful description. A blank
           panel with no content is a defect.

        4. **Fieldset and legend visibility**: Fieldset borders with legend
           labels must be fully visible. Legend text must not be clipped or
           render as near-invisible against the border.

        5. **Stat/metric card label readability**: Value numbers must be
           clearly larger than their labels. Truncated labels without a
           tooltip are a defect.

        6. **Obvious layout defects**: Overflowing text, misaligned elements,
           overlapping UI, content bleeding outside its container.

        Note every issue you find before moving to Phase 2.

        ---

        ## Phase 2 — Interactive testing

        ## Getting started

        The app is running at `http://localhost:3000/ai-github-actions-playground/`
        with a seeded Elasticsearch cluster containing synthetic Kubernetes
        OTel metrics. Pod CPU/memory/restart data for cluster `peek-demo-cluster`
        across namespaces `app-prod`, `monitoring`, and `kube-system` should
        be available.

        1. `browser_navigate` to the app URL above.
        2. In the connection dialog, enter `http://localhost:9200` as the
           Elasticsearch URL, then click Connect.
        3. Navigate to the Kubernetes section in the sidebar.
        4. After connecting, use `browser_snapshot` after each action to see
           what changed, and `browser_take_screenshot` to capture evidence.

        ## Visual quality checks

        On every run, also check these visual quality dimensions:

        1. **Pod table readability**: After viewing pods, are CPU utilization
           percentages, memory values, and restart counts formatted clearly?
           Are units shown (e.g. "%" for CPU, "MB"/"GB" for memory)?

        2. **Node list contrast**: Check the node list in dark mode. Are
           hostname labels and health indicators readable?

        3. **Empty state (no data for time range)**: Set the time range to
           "last 5 minutes" to test a near-empty range. Verify the no-data
           state is visually complete with icon, title, and description.

        4. **Workload grouping labels**: Are Deployment, StatefulSet, and
           DaemonSet badges styled consistently? Are they readable in dark mode?

        5. **Dark mode tables**: Switch to dark mode. Navigate to the pod
           list. Are alternating row backgrounds, borders, and text all readable?

        ## Output rules

        - **Silence is better than noise.** Only file an issue for genuine bugs.
        - If everything works, do **not** open an issue.
        - If you find problems, create **one** issue describing what you
          tried, what you expected, what actually happened, and screenshots.
        - When creating an issue, prefix the title with `[explore-kubernetes]`
          (after the automatically added `[gemini-cli]` prefix).
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
