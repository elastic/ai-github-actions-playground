name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'peek/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: peek/package-lock.json

      - name: Install dependencies
        working-directory: peek
        run: npm ci

      - name: Build
        working-directory: peek
        run: npm run build

      - name: Generate demo config
        working-directory: peek/dist
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
          DEMO_USERNAME: ${{ secrets.DEMO_USERNAME }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ -z "${DEMO_PASSWORD}" ]; then
            echo "DEMO_PASSWORD is not set; skipping demo config generation."
            exit 0
          fi
          jq -n \
            --arg url "$DEMO_URL" \
            --arg username "$DEMO_USERNAME" \
            --arg password "$DEMO_PASSWORD" \
            '{"url": $url, "username": $username, "password": $password}' > demo.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: peek/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
