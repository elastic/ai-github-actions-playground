name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'peek/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/deploy-pr-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: peek/package-lock.json

      - name: Install dependencies
        working-directory: peek
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build
        working-directory: peek
        run: npm run build

      - name: Generate demo config
        working-directory: peek/dist
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
          DEMO_USERNAME: ${{ secrets.DEMO_USERNAME }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ -z "${DEMO_PASSWORD}" ]; then
            echo "DEMO_PASSWORD is not set; skipping demo config generation."
            exit 0
          fi
          jq -n \
            --arg url "$DEMO_URL" \
            --arg username "$DEMO_USERNAME" \
            --arg password "$DEMO_PASSWORD" \
            '{"url": $url, "username": $username, "password": $password}' > demo.json

      - name: Upload artifact
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: peek/dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
