name: UI Smoke Test PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "peek/**"
      - "Makefile"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ui-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: peek/package-lock.json

      - name: Install dependencies
        run: cd peek && npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Install Playwright Browsers & Deps
        run: npx playwright install --with-deps chromium webkit
        working-directory: peek

      - name: Run E2E smoke tests
        id: smoke
        continue-on-error: true
        working-directory: peek
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: smoke-results.json
          PLAYWRIGHT_PREVIEW: "1"
        run: |
          npm run build
          npx playwright test tests/e2e/smoke.spec.ts --reporter=json

      - name: Run screenshot preflight
        id: preflight
        continue-on-error: true
        working-directory: peek
        run: |
          npm run preview -- --port 3000 &
          DEV_PID=$!
          SERVER_READY=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ai-github-actions-playground/ >/dev/null 2>&1; then SERVER_READY=true; break; fi
            sleep 1
          done
          if [ "$SERVER_READY" = false ]; then
            echo "::error::Preview server failed to start within 30 seconds"
            kill "$DEV_PID" 2>/dev/null || true
            exit 1
          fi
          node scripts/screenshot-preflight.mjs \
            --url http://localhost:3000/ai-github-actions-playground/ \
            --output screenshot-preflight.json \
            --screenshot screenshot.png
          PREFLIGHT_EXIT=$?
          kill "$DEV_PID" 2>/dev/null || true
          exit "$PREFLIGHT_EXIT"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-review-${{ github.event.pull_request.number }}
          retention-days: 14
          path: |
            peek/smoke-results.json
            peek/screenshot-preflight.json
            peek/screenshot.png
            peek/test-results/

      - name: Post PR review comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // ── Parse smoke test results ──────────────────────────────
            let smokeSection = "";
            let testCount = { total: 0, passed: 0, failed: 0, flaky: 0, skipped: 0 };
            let smokeResultsParsed = false;

            try {
              const results = JSON.parse(
                fs.readFileSync("peek/smoke-results.json", "utf8"),
              );
              const stats = results.stats || {};
              testCount = {
                total:
                  (stats.expected || 0) +
                  (stats.unexpected || 0) +
                  (stats.flaky || 0) +
                  (stats.skipped || 0),
                passed: stats.expected || 0,
                failed: stats.unexpected || 0,
                flaky: stats.flaky || 0,
                skipped: stats.skipped || 0,
              };
              smokeResultsParsed = true;

              const smokeStatus =
                testCount.failed === 0
                  ? "✅ All passed"
                  : `❌ ${testCount.failed} failed`;

              // Recursively extract specs from nested suites
              function extractSpecs(suites) {
                const specs = [];
                for (const suite of suites) {
                  for (const spec of suite.specs || []) {
                    const result = spec.tests?.[0]?.results?.[0];
                    const errors = result?.errors || [];
                    specs.push({
                      title: spec.title,
                      ok: spec.ok,
                      duration: result?.duration ?? 0,
                      error:
                        errors.map((e) => e.message).join("\n") || null,
                    });
                  }
                  if (suite.suites) {
                    specs.push(...extractSpecs(suite.suites));
                  }
                }
                return specs;
              }

              const specs = extractSpecs(results.suites || []);
              let testRows = "";
              for (const spec of specs) {
                const icon = spec.ok ? "✅" : "❌";
                const dur = spec.duration ? `${spec.duration}ms` : "—";
                testRows += `| ${icon} | ${spec.title} | ${dur} |\n`;
              }

              smokeSection = [
                "### 🎭 Smoke Test Results",
                "",
                `**Status:** ${smokeStatus}`,
                "",
                "| Total | Passed | Failed | Flaky | Skipped |",
                "|-------|--------|--------|-------|---------|",
                `| ${testCount.total} | ${testCount.passed} | ${testCount.failed} | ${testCount.flaky} | ${testCount.skipped} |`,
                "",
                "<details>",
                "<summary>Individual test results</summary>",
                "",
                "| Status | Test | Duration |",
                "|--------|------|----------|",
                testRows.trimEnd(),
                "",
                "</details>",
              ].join("\n");

              // Append failure details
              const failedSpecs = specs.filter((s) => !s.ok && s.error);
              if (failedSpecs.length > 0) {
                smokeSection +=
                  "\n\n<details>\n<summary>❌ Failure details</summary>\n";
                for (const spec of failedSpecs) {
                  smokeSection += `\n**${spec.title}:**\n\`\`\`\n${spec.error}\n\`\`\`\n`;
                }
                smokeSection += "\n</details>";
              }
            } catch {
              smokeSection = [
                "### 🎭 Smoke Test Results",
                "",
                `⚠️ Could not parse smoke test results. Check the [workflow run](${runUrl}) for details.`,
              ].join("\n");
            }

            // ── Parse preflight diagnostics ───────────────────────────
            let preflightSection = "";
            let preflightClean = false;

            try {
              const diag = JSON.parse(
                fs.readFileSync("peek/screenshot-preflight.json", "utf8"),
              );
              // Mirror the benign-error filter from screenshot-preflight.mjs
              // (Google Fonts DNS failures in sandboxed CI environments).
              const consoleErrors = (diag.consoleErrors || []).filter(
                (e) =>
                  !/fonts\.googleapis\.com|fonts\.gstatic\.com|ERR_NAME_NOT_RESOLVED/.test(
                    e,
                  ),
              );
              const pageErrors = diag.pageErrors || [];
              const uiErrors = diag.uiErrors || [];

              preflightClean =
                consoleErrors.length === 0 &&
                pageErrors.length === 0 &&
                uiErrors.length === 0;

              let details = "";
              if (preflightClean) {
                details =
                  "No console errors, page errors, or UI alerts detected.";
              } else {
                if (consoleErrors.length > 0) {
                  details += `**Console errors (${consoleErrors.length}):**\n`;
                  for (const e of consoleErrors.slice(0, 10)) {
                    details += `- \`${e.substring(0, 200)}\`\n`;
                  }
                  details += "\n";
                }
                if (pageErrors.length > 0) {
                  details += `**Page errors (${pageErrors.length}):**\n`;
                  for (const e of pageErrors.slice(0, 10)) {
                    details += `- \`${e.substring(0, 200)}\`\n`;
                  }
                  details += "\n";
                }
                if (uiErrors.length > 0) {
                  details += `**UI error alerts (${uiErrors.length}):**\n`;
                  for (const e of uiErrors.slice(0, 10)) {
                    details += `- \`${e.substring(0, 200)}\`\n`;
                  }
                }
              }

              preflightSection = [
                "### 📸 Screenshot Preflight",
                "",
                `**Result:** ${preflightClean ? "✅ Clean — no errors detected" : "❌ Errors found"}`,
                "",
                details,
              ].join("\n");
            } catch {
              preflightSection = [
                "### 📸 Screenshot Preflight",
                "",
                `⚠️ Could not parse preflight diagnostics. Check the [workflow run](${runUrl}) for details.`,
              ].join("\n");
            }

            // ── Recommendations ───────────────────────────────────────
            const recommendations = [];
            if (!smokeResultsParsed) {
              recommendations.push(
                "🔧 Smoke test results were unavailable or invalid — rerun this workflow and verify `peek/smoke-results.json` is generated.",
              );
            }
            if (testCount.failed > 0) {
              recommendations.push(
                "🔧 Fix failing E2E smoke tests before merging.",
              );
            }
            if (!preflightClean) {
              recommendations.push(
                "🔧 Investigate console or page errors reported by the screenshot preflight.",
              );
            }
            if (testCount.flaky > 0) {
              recommendations.push(
                "⚠️ Flaky tests detected — consider stabilizing them.",
              );
            }
            if (smokeResultsParsed && testCount.failed === 0 && preflightClean) {
              recommendations.push(
                "✨ All smoke tests pass and no UI errors detected. Ready for review.",
              );
            }

            // ── Compose comment ───────────────────────────────────────
            const allGood = smokeResultsParsed && testCount.failed === 0 && preflightClean;
            const statusEmoji = allGood ? "✅" : "❌";
            const MARKER = "<!-- ui-smoke-test-pr-review -->";

            const body = [
              MARKER,
              `## ${statusEmoji} UI Smoke Test Review — \`${sha}\``,
              "",
              smokeSection,
              "",
              preflightSection,
              "",
              "### 💡 Recommendations",
              "",
              recommendations.map((r) => `- ${r}`).join("\n"),
              "",
              "---",
              `📎 Full diagnostics and screenshots: [workflow run](${runUrl})`,
            ].join("\n");

            // ── Post or update comment ────────────────────────────────
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber, per_page: 100 },
            );
            const existing = comments.find((c) =>
              c.body?.includes(MARKER),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
              core.info("Created new PR comment");
            }

      - name: Fail if smoke tests or preflight failed
        if: steps.smoke.outcome == 'failure' || steps.preflight.outcome == 'failure'
        run: |
          echo "::error::Smoke tests or screenshot preflight failed — see PR comment for details."
          exit 1
