name: "Smoke: Live Elasticsearch E2E"
on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-scheduled-audit.lock.yml@main
    with:
      title-prefix: "[smoke-live-es]"
      setup-commands: |
        make setup
        cd peek && npx playwright install chromium
      additional-instructions: |
        You are the Live Elasticsearch Smoke Agent. You spin up a real
        Elasticsearch 9.0.0 + EDOT collector, replay captured OTLP data
        (traces, metrics, logs) through the collector pipeline, seed
        non-OTLP data (web_logs, orders, ingest pipelines), then run
        Playwright E2E tests that verify REAL data renders in every major
        page of Elastic Peek.

        Unlike the other smoke agents that use mocked Elasticsearch
        responses, you validate that the app works end-to-end against a
        real cluster with data from the actual OTel pipeline.

        ## Start the replay stack

        1. Start Elasticsearch + EDOT collector in replay mode:

        ```bash
        docker compose -f docker-compose.otel-es.yml -f docker-compose.otel-replay.yml up -d
        ```

        2. Wait for the stack to become healthy:

        ```bash
        for i in $(seq 1 60); do
          curl -sf http://localhost:9200 >/dev/null 2>&1 && break
          sleep 2
        done
        curl -sf http://localhost:9200 || { echo "ES failed to start"; exit 1; }
        ```

        ## Replay OTLP data + seed non-OTLP data

        3. Replay captured OTel fixtures (traces, metrics, logs) through
           the EDOT collector pipeline:

        ```bash
        cd peek && node scripts/otel-replay.mjs
        ```

        4. Seed non-OTLP data (web_logs, orders, ingest pipelines):

        ```bash
        cd peek && node scripts/seed-elasticsearch.mjs --url http://localhost:9200
        ```

        5. Wait a few seconds for the collector to flush data to ES,
           then verify:

        ```bash
        sleep 5
        curl -s 'http://localhost:9200/_cat/indices?v'
        curl -s 'http://localhost:9200/_cat/data_streams?v'
        ```

        You should see indices like `traces-generic.otel-default`,
        `metrics-hostmetricsreceiver.otel-default`, `logs-generic.otel-default`,
        `web_logs`, and `orders`.

        ## Run Live ES Tests

        6. Run the Playwright tests against the live Elasticsearch:

        ```bash
        cd peek && \
        ES_URL=http://localhost:9200 \
        npx playwright test tests/e2e/smoke-live-es.spec.ts --reporter=list 2>&1 \
          | tee /tmp/live-es-output.txt
        ```

        ## Analyze

        7. Read the test output from `/tmp/live-es-output.txt`.
        8. **Read every screenshot** from `peek/test-results/live-es-*.png` and
           **read the DOM dumps** from `peek/test-results/live-es-dom-*.html`.
           Look at each image carefully for:
           - Real data rendering (actual index names, node counts, trace IDs)
           - Empty states that should have data
           - Error alerts or error banners
           - Layout issues with real-sized data
        9. Read any Playwright trace files if tests failed on retry.

        ## Cleanup

        10. Stop the stack:

        ```bash
        docker compose -f docker-compose.otel-es.yml -f docker-compose.otel-replay.yml down -v
        ```

        ## Output rules

        - If tests pass and screenshots look correct, do NOT open an issue.
        - If tests fail or screenshots show problems, create one issue with:
          - Which tests failed and the assertion output
          - Screenshots showing the issue
          - Whether the problem is in replay, seeding, connection, or rendering
          - Reproduction steps
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
