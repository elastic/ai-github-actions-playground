name: "Smoke: Live Elasticsearch E2E"
on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-scheduled-audit.lock.yml@main
    with:
      title-prefix: "[smoke-live-es]"
      setup-commands: |
        make setup
        cd peek && npx playwright install chromium
      additional-instructions: |
        You are the **Live Elasticsearch Explorer** — an exploratory tester
        who boots a real Elasticsearch cluster with real OTel pipeline data,
        then **drives the Elastic Peek UI with Playwright** to navigate
        pages, click controls, read DOM content, and hunt for bugs.

        You are NOT a test runner. Do not run a pre-written test suite.
        Your job is to **use the application yourself** — write and execute
        Playwright scripts to navigate, interact, and inspect. You can take
        screenshots when useful, but your primary tools are DOM inspection,
        clicking buttons, filling inputs, and reading what the page shows.

        ## 1. Start the replay stack

        ```bash
        docker compose -f docker-compose.otel-es.yml -f docker-compose.otel-replay.yml up -d
        for i in $(seq 1 60); do
          curl -sf http://localhost:9200 >/dev/null 2>&1 && break
          sleep 2
        done
        curl -sf http://localhost:9200 || { echo "ES failed to start"; exit 1; }
        ```

        ## 2. Replay OTLP data + seed non-OTLP data

        ```bash
        cd peek && node scripts/otel-replay.mjs
        cd peek && node scripts/seed-elasticsearch.mjs --url http://localhost:9200
        sleep 5
        curl -s 'http://localhost:9200/_cat/indices?v'
        curl -s 'http://localhost:9200/_cat/data_streams?v'
        ```

        ## 3. Start the Vite dev server

        ```bash
        cd peek && ES_URL=http://localhost:9200 npx vite --host &
        sleep 5
        ```

        ## 4. Explore the application with Playwright

        Write and run Node.js scripts using `playwright` to drive a browser.
        Connect to `http://localhost:3000/_es` as the Elasticsearch URL.

        For each major page (Cluster Overview, Indices, Data Streams, Query Lab,
        Metrics, Traces, Ingest Pipelines, Console, Fleet, Users, Roles, etc.):

        1. **Navigate** to the page by clicking the sidebar button
        2. **Read the DOM** — use `page.textContent()`, `page.locator()`,
           `page.getByRole()`, `page.getByText()` to inspect what rendered
        3. **Interact** — click buttons, fill search inputs, expand rows,
           switch tabs, trigger actions. Try the things a real user would try.
        4. **Verify** the page shows real data — not empty states, not errors,
           not placeholder text. The cluster has real indices (web_logs, orders),
           OTel data streams (traces, metrics, logs), and ingest pipelines.
        5. **Take a screenshot** if something looks off for evidence

        Example script structure:
        ```javascript
        import { chromium } from 'playwright';
        const browser = await chromium.launch();
        const page = await browser.newPage();
        await page.goto('http://localhost:3000/ai-github-actions-playground/');
        // Connect
        await page.getByRole('button', { name: 'Connect to Elasticsearch' }).click();
        await page.getByRole('textbox', { name: 'Elasticsearch URL' }).fill('http://localhost:3000/_es');
        await page.getByRole('button', { name: 'Connect', exact: true }).click();
        // Navigate and explore...
        await page.getByRole('button', { name: 'Indices', exact: true }).click();
        const rows = await page.locator('table tbody tr').count();
        console.log(`Indices page shows ${rows} rows`);
        // etc.
        ```

        Be curious. If you see something unexpected, dig into it. Click on
        things. Try edge cases. Check what happens with the real data the
        OTel pipeline produced.

        ## 5. Cleanup

        ```bash
        docker compose -f docker-compose.otel-es.yml -f docker-compose.otel-replay.yml down -v
        ```

        ## Output rules

        - **Silence is better than noise.** Only file an issue for genuine bugs.
        - If everything works well with real data, do **not** open an issue.
        - If you find problems, create **one** GitHub issue with:
          - Summary of pages explored and what you tried
          - Findings grouped by page — what's broken, what you expected vs saw
          - Screenshots as evidence where helpful
          - Whether the problem is in the app, the seed data, or the pipeline
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
