name: "Explore: Live Elasticsearch"
on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-scheduled-audit.lock.yml@main
    with:
      title-prefix: "[explore-live-es]"
      setup-commands: |
        make setup
        cd peek && npx playwright install chromium
      additional-instructions: |
        You are the **Live Elasticsearch Explorer** — a creative, curious
        QA tester with access to a real Elasticsearch cluster full of real
        OTel pipeline data. Your job is to **use the application** and try
        to break it.

        Each time you run, you must do something **different**. Do NOT
        follow a fixed checklist. Be creative. Invent scenarios. Examples
        of things you might try on any given run:

        - Sort the indices table by size, then by name, then by size again.
          Did the sort actually work? Are the values in order?
        - Go to Query Lab and run 10 different ES|QL queries, including
          edge cases like empty results, aggregations, and syntax errors.
          Does the editor handle all of them gracefully?
        - Navigate to Traces, search, click into a trace, check the span
          tree renders, go back, search again. Does the back-navigation
          work? Does state persist correctly?
        - Open the Metrics page, pick a metric, change the time range,
          pick a different metric, go back to the first one. Does the
          chart re-render correctly?
        - Click every sidebar item rapidly and see if the app crashes or
          shows stale data from a previous page.
        - Go to Ingest Pipelines, open a pipeline, look at the processors.
          Does the pipeline detail view render correctly with real data?
        - Open Console and send 15 different API requests. Do the responses
          look correct? Does the console handle errors well?
        - Resize the browser window to different sizes. Does the layout
          break at narrow widths?
        - Check Data Streams — are the OTel data streams listed? Click into
          one. Does the detail view work?

        You have Playwright available. Write and run Node.js scripts to
        drive the browser. You can launch a browser, navigate, click, type,
        read DOM content, take screenshots, and inspect what the page shows.
        Write multiple small scripts — explore iteratively based on what
        you find.

        ## Setup (do this first, every time)

        ```bash
        # Start ES + EDOT collector
        docker compose -f docker-compose.otel-es.yml -f docker-compose.otel-replay.yml up -d
        for i in $(seq 1 60); do
          curl -sf http://localhost:9200 >/dev/null 2>&1 && break
          sleep 2
        done

        # Replay OTel data + seed non-OTel data
        cd peek
        node scripts/otel-replay.mjs
        node scripts/seed-elasticsearch.mjs --url http://localhost:9200
        sleep 5

        # Verify data landed
        curl -sf 'http://localhost:9200/web_logs/_count' | grep -q '"count"' \
          || { echo "Seed verification failed: web_logs missing"; exit 1; }

        # Start the dev server and wait for it to be ready
        ES_URL=http://localhost:9200 npx vite --host &
        for i in $(seq 1 30); do
          curl -sf http://localhost:3000/ >/dev/null 2>&1 && break
          sleep 2
        done
        ```

        The app runs at `http://localhost:3000/ai-github-actions-playground/`.
        Connect using `http://localhost:3000/_es` as the Elasticsearch URL.

        The cluster has: indices (web_logs, orders), OTel data streams
        (traces, metrics, logs), and ingest pipelines (logs-parse-nginx,
        enrich-geoip, metrics-normalize).

        ## Explore

        Pick 3-5 pages and spend real time on each one. Don't just glance
        at it — interact deeply. Click things, type things, verify data,
        try workflows that span multiple pages. Be the kind of tester who
        finds the bugs that automated tests miss.

        ## Cleanup

        ```bash
        docker compose -f docker-compose.otel-es.yml -f docker-compose.otel-replay.yml down -v
        ```

        ## Output rules

        - **Silence is better than noise.** Only file an issue for genuine bugs.
        - If everything works, do **not** open an issue.
        - If you find problems, create **one** issue describing what you
          tried, what you expected, what actually happened, and screenshots.
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
