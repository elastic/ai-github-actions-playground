name: Address Merge Conflicts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: merge-conflict-addresser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-conflicted-prs:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.detect.outputs.prs }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - name: Wait for PR mergeability state to settle
        run: sleep 60

      - name: Detect open PRs with merge conflicts
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = "no-address-merge-conflicts";
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function getConflictState(prNumber, graphMergeStateStatus) {
              let last = null;

              for (let attempt = 1; attempt <= 3; attempt++) {
                const { data } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber,
                });
                last = data;

                const mergeable = data.mergeable; // true, false, or null while GitHub computes
                const mergeableState = data.mergeable_state; // e.g. clean, dirty, blocked, unstable
                core.info(
                  `PR #${prNumber}: attempt ${attempt}, mergeable=${mergeable}, mergeable_state=${mergeableState}, graph_mergeStateStatus=${graphMergeStateStatus}`,
                );

                if (mergeable !== null) {
                  return {
                    conflicted: mergeable === false || mergeableState === "dirty",
                    mergeable,
                    mergeableState,
                    source: "rest",
                  };
                }

                if (attempt < 3) {
                  await sleep(1500 * attempt);
                }
              }

              // If GitHub still hasn't computed mergeability, fall back to GraphQL DIRTY.
              return {
                conflicted:
                  last?.mergeable === false ||
                  last?.mergeable_state === "dirty" ||
                  graphMergeStateStatus === "DIRTY",
                mergeable: last?.mergeable ?? null,
                mergeableState: last?.mergeable_state ?? null,
                source: "fallback",
              };
            }

            const prs = [];
            let cursor = null;

            while (true) {
              const result = await github.graphql(
                `query($owner: String!, $repo: String!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequests(first: 50, states: OPEN, after: $cursor, orderBy: { field: UPDATED_AT, direction: DESC }) {
                      nodes {
                        number
                        isDraft
                        mergeStateStatus
                        labels(first: 50) {
                          nodes { name }
                        }
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }`,
                { owner, repo, cursor },
              );

              const connection = result.repository.pullRequests;
              for (const pr of connection.nodes) {
                const labels = new Set((pr.labels?.nodes ?? []).map((l) => l.name));
                const optedIn = !labels.has(LABEL);
                const conflictState = await getConflictState(pr.number, pr.mergeStateStatus);
                const conflicted = conflictState.conflicted;
                if (!pr.isDraft && optedIn && conflicted) {
                  prs.push({ number: pr.number });
                }
              }

              if (!connection.pageInfo.hasNextPage) break;
              cursor = connection.pageInfo.endCursor;
            }

            core.info(`Found ${prs.length} conflicted PR(s) without opt-out label '${LABEL}'.`);
            core.setOutput("prs", JSON.stringify(prs));
            core.setOutput("count", String(prs.length));

  address-conflicts:
    needs: detect-conflicted-prs
    if: needs.detect-conflicted-prs.outputs.count != '0'
    permissions:
      actions: read
      contents: write
      discussions: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        pr: ${{ fromJson(needs.detect-conflicted-prs.outputs.prs) }}
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-mention-in-pr-by-id.lock.yml@main
    with:
      target-pr-number: ${{ matrix.pr.number }}
      prompt: |
        Resolve merge conflicts with the current base branch.
      additional-instructions: |
        This run was started by the Address Merge Conflicts workflow.
        Work only on PR #${{ matrix.pr.number }}.
        If the PR has merge conflicts, resolve them by merging the latest origin/main into the PR branch and push.
        If there are no merge conflicts anymore, post a short note and make no code changes.
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
