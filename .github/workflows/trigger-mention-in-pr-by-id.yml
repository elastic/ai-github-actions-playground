name: Trigger Mention in PR by ID
on:
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: PR number to target (e.g. 123)
        required: true
        type: string
      prompt:
        description: Prompt for the agent (review/fix/explain/etc.)
        required: true
        type: string

permissions:
  actions: read
  contents: write
  discussions: write
  issues: write
  pull-requests: write

jobs:
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.reactions.createForIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(${{ inputs.pull-request-number }}),
              content: 'eyes'
            });

  run:
    needs: react
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-mention-in-pr-by-id.lock.yml@main
    with:
      target-pr-number: ${{ inputs.pull-request-number }}
      prompt: ${{ inputs.prompt }}
      additional-instructions: |
        This run was started via workflow_dispatch with an explicit PR target.
        You MUST operate only on PR #${{ inputs.pull-request-number }}.
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
