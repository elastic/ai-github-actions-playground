name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        if: github.event.action != 'closed'
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: peek/package-lock.json

      - name: Install dependencies
        if: github.event.action != 'closed'
        working-directory: peek
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build
        if: github.event.action != 'closed'
        working-directory: peek
        run: npm run build

      - name: Generate demo config
        if: github.event.action != 'closed'
        working-directory: peek/dist
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
          DEMO_USERNAME: ${{ secrets.DEMO_USERNAME }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ -z "${DEMO_PASSWORD}" ]; then
            echo "DEMO_PASSWORD is not set; skipping demo config generation."
            exit 0
          fi
          jq -n \
            --arg url "$DEMO_URL" \
            --arg username "$DEMO_USERNAME" \
            --arg password "$DEMO_PASSWORD" \
            '{"url": $url, "username": $username, "password": $password}' > demo.json

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./peek/dist/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          wait-for-pages-deployment: true
