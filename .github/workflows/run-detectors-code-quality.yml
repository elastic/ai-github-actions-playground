name: Run Detectors – Code Quality
on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workflow:
          - breaking-change-detector.yml
          - code-duplication-detector.yml
          - framework-best-practices.yml
          - performance-profiler.yml
          - react-accessibility.yml
          - react-component-best-practices.yml
          - react-performance.yml
          - react-performance-sweeper.yml
          - react-state-bug-hunter.yml
          - react-ui-boilerplate-sweeper.yml
          - refactor-opportunist.yml
      fail-fast: false
      max-parallel: 5
    steps:
      - name: Dispatch ${{ matrix.workflow }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ matrix.workflow }}" --repo "${{ github.repository }}"
