name: Address Merge Conflict

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: "PR number to resolve merge conflicts for"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: address-merge-conflict-${{ inputs.pr-number }}
  cancel-in-progress: true

jobs:
  address-conflict:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-mention-in-pr-by-id.lock.yml@main
    with:
      target-pr-number: ${{ inputs.pr-number }}
      prompt: |
        Resolve merge conflicts on PR #${{ inputs.pr-number }}.

        Follow these steps exactly:
        1. Run: git fetch origin main
        2. Run: git checkout origin/$PR_BRANCH (get the PR branch name from the GitHub API or pr.json)
        3. Run: git merge origin/main
        4. If the merge has conflicts, resolve every conflict, then commit and push.
        5. If the merge succeeds with no conflicts, post a short comment and make no code changes.

        Do NOT skip the git merge step. You must actually attempt the merge to discover conflicts.
      additional-instructions: |
        This run was started by the Address Merge Conflicts workflow.
        Work only on PR #${{ inputs.pr-number }}.
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
