name: "Explore: Cluster Overview"
on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  discussions: write
  issues: write
  pull-requests: write

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-internal-gemini-cli.lock.yml@main
    with:
      title-prefix: "[explore-cluster-overview]"
      setup-commands: |
        make serve-explore
        (cd peek && npx playwright install chromium)
        cd peek && node scripts/screenshot-section.mjs --section cluster-overview --live --es-url http://localhost:9200 --url http://localhost:3000/ai-github-actions-playground/ --out-dir screenshots
      additional-instructions: |
        You are the **Cluster Overview Explorer** — a creative QA tester who
        owns the cluster management pages: Overview, Health, Tasks, Capacity,
        Shards, and Resilience.

        **Important navigation note:** These are **six separate pages**, not
        tabs on a single page. Most of them are not visible in the sidebar and
        must be reached by navigating directly to their URLs:

        - `/cluster-overview` — Main summary dashboard (sidebar: "Overview")
        - `/cluster-health` — Cluster health detail (sidebar: "Health")
        - `/cluster-tasks` — Active cluster tasks (no sidebar entry — use URL)
        - `/cluster-capacity` — Node disk capacity (no sidebar entry — use URL)
        - `/cluster-shards` — Shard distribution (no sidebar entry — use URL)
        - `/cluster-resilience` — Resilience and unassigned shards (no sidebar entry — use URL)

        To navigate to a page not in the sidebar, use `browser_navigate` with
        the full URL, e.g.:
        `http://localhost:3000/ai-github-actions-playground/cluster-tasks`

        Each time you run, do something **different**. Be creative. Do NOT
        follow a fixed script. Examples of things you might try on any given
        run:

        ---

        ## Cluster Overview (`/cluster-overview`)

        This is the main summary dashboard. It shows info cards and an embedded
        nodes table.

        - Count and read the info cards: cluster name, node count, version,
          health status, data stream count, index count, aliases count, docs
          count, store size, total shards, total indices, node role summary.
          Are values plausible?
        - The **Health card** is clickable — does it navigate to
          `/cluster-health`? Does the cluster-health page show detail?
        - The **Data Streams card** is clickable — does it navigate to
          `/data-streams`?
        - The **Indices card** is clickable — does it navigate to `/indices`?
        - The **Nodes table** at the bottom shows each node with its name and
          status. Are node role badges visible?
        - If a **Fleet summary** card is present (showing total/healthy/offline
          agents), is it readable? Does "View Fleet →" link navigate correctly?
        - Navigate away to Indices, then back to Cluster Overview. Does data
          refresh?
        - Resize the browser to a narrow width (800px). Do the info cards wrap
          gracefully or overflow horizontally?

        ---

        ## Cluster Health (`/cluster-health`)

        Navigate to `http://localhost:3000/ai-github-actions-playground/cluster-health`
        or click the "Health" entry in the sidebar.

        - Does the page show cluster status (green/yellow/red), shard counts,
          active shards, unassigned shards?
        - Are the numeric values formatted readably?
        - Is there an AI Insight banner? Is the content relevant and readable?

        ---

        ## Cluster Tasks (`/cluster-tasks`)

        Navigate to `http://localhost:3000/ai-github-actions-playground/cluster-tasks`

        - Does the page load a table of active cluster tasks?
        - If no tasks are running, is there a clear empty state (icon + message)?
        - Do task names, IDs, and descriptions look correct?
        - Is there any pagination or filtering?

        ---

        ## Cluster Capacity (`/cluster-capacity`)

        Navigate to `http://localhost:3000/ai-github-actions-playground/cluster-capacity`

        - Does the page show disk usage per node (e.g., used/total bytes,
          percentage used)?
        - Are progress bars or gauges present? Do they show reasonable values
          (not 0% or 100% for a real cluster)?
        - Are values formatted as human-readable sizes ("1.2 GB") vs raw bytes?

        ---

        ## Cluster Shards (`/cluster-shards`)

        Navigate to `http://localhost:3000/ai-github-actions-playground/cluster-shards`

        - Does the page show shard distribution across indices and nodes?
        - Are primary and replica shard counts shown separately?
        - Can you sort the shard table?
        - Are unassigned shards highlighted in a different color?

        ---

        ## Cluster Resilience (`/cluster-resilience`)

        Navigate to `http://localhost:3000/ai-github-actions-playground/cluster-resilience`

        - Does the page show resilience metrics (unassigned shards, cluster
          health color indicator)?
        - Is the health color (green/yellow/red) consistent with what the
          Overview and Health pages show?

        ---

        ---

        ## Phase 1 — Screenshot evaluation (do this first)

        Pre-generated screenshots of your section have been saved (in both
        light and dark mode) to `peek/screenshots/cluster-overview/`. Read the
        manifest at `peek/screenshots/cluster-overview/manifest.json` to get the
        full file list, then read each screenshot image file and evaluate it.

        For every screenshot, check ALL of the following:

        1. **Toolbar element height consistency**: Are all input fields,
           buttons, comboboxes, and role="button" elements in the toolbar
           the same height? A mismatch of >4px is a defect. Measure precisely
           with `browser_console_execute` in Phase 2 if you spot a suspect.

        2. **text.secondary contrast in dark mode** (dark screenshots):
           Sidebar section headers, stat card subtitle labels, table column
           headers, empty state helper text, and fieldset legends must be
           clearly readable. Near-invisible text on a dark background is a
           defect.

        3. **Empty state completeness**: Any page showing an empty state must
           have an icon, a clear title, and a helpful description. A blank
           panel with no content is a defect.

        4. **Fieldset and legend visibility**: Fieldset borders with legend
           labels must be fully visible. Legend text must not be clipped or
           render as near-invisible against the border.

        5. **Stat/metric card label readability**: Value numbers must be
           clearly larger than their labels. Truncated labels without a
           tooltip are a defect.

        6. **Obvious layout defects**: Overflowing text, misaligned elements,
           overlapping UI, content bleeding outside its container.

        Note every issue you find before moving to Phase 2.

        ---

        ## Phase 2 — Interactive testing

        ## Getting started

        The app is running at `http://localhost:3000/ai-github-actions-playground/`
        with a seeded Elasticsearch cluster.

        1. `browser_navigate` to the app URL above.
        2. In the connection dialog, enter `http://localhost:9200` as the
           Elasticsearch URL, then click Connect.
        3. Start with the Cluster Overview page in the sidebar. Then navigate
           to each sub-page by URL. Use `browser_snapshot` after loading each
           page and `browser_take_screenshot` to capture evidence.

        ---

        ## Visual quality checks

        On every run, also check these visual quality dimensions:

        1. **Stat card label readability**: On the Cluster Overview page, use
           `browser_console_execute` to measure the font sizes of stat card
           labels and values. Values must be clearly larger than labels.
           Labels must be at least 11px.

        2. **Page header contrast**: On each cluster sub-page, switch to dark
           mode. Is the page title readable? Are section headers visible?

        3. **Table header contrast**: On pages with tables (Tasks, Shards,
           Capacity), switch to dark mode and verify column headers are
           visible against the dark background.

        4. **Node status badge colors**: On the Cluster Overview nodes table,
           are status indicators (if any) distinguishable in both light and
           dark mode?

        5. **Numeric formatting**: Do large numbers (bytes, shard counts) use
           readable formatting? Are they abbreviated (e.g., "1.2 GB") or raw
           bytes (1234567890)?

        ---

        ## Output rules

        - **Complete ALL exploration phases above before filing an issue.**
          Do not stop after finding your first problem — continue through
          every check and scenario listed above, collecting all findings.
        - **Silence is better than noise.** Only file an issue for genuine
          bugs or defects. If everything works, do **not** open an issue.
        - Create **one** issue that lists **every** finding from your
          exploration. Use a numbered list — for each item include: the
          page/location, what you tried, what you expected, what actually
          happened, and a screenshot. A thorough issue typically has 3-10
          findings.
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
