name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Prettier
        working-directory: dashboard
        run: npx prettier --check src

      - name: ESLint
        working-directory: dashboard
        run: npx eslint src

      - name: TypeScript
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Build
        working-directory: dashboard
        run: npx vite build
