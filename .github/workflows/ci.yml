name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "peek/src/**"
      - "peek/tests/**"
      - "peek/package*.json"
      - "peek/tsconfig*.json"
      - "peek/vite.config.ts"
      - "peek/vitest*.ts"
      - "peek/playwright.config.ts"
      - "peek/eslint*"
      - "peek/eslint-plugin-peek/**"
      - "Makefile"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "peek/src/**"
      - "peek/tests/**"
      - "peek/package*.json"
      - "peek/tsconfig*.json"
      - "peek/vite.config.ts"
      - "peek/vitest*.ts"
      - "peek/playwright.config.ts"
      - "peek/eslint*"
      - "peek/eslint-plugin-peek/**"
      - "Makefile"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: peek/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('peek/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: cd peek && npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: peek/.eslintcache
          key: eslint-${{ runner.os }}-${{ github.ref }}-${{ github.run_number }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ github.ref }}-
            eslint-${{ runner.os }}-

      - name: Lint and typecheck (changed files only)
        if: github.event_name == 'pull_request'
        run: make lint BASE=origin/${{ github.event.pull_request.base.ref }}

      - name: Lint and typecheck (full)
        if: github.event_name == 'push'
        run: make lint-full

      - name: Build
        run: make build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: peek/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('peek/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: cd peek && npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Unit tests (changed files only)
        if: github.event_name == 'pull_request'
        run: make test-unit BASE=origin/${{ github.event.pull_request.base.ref }}

      - name: Unit tests with coverage (full)
        if: github.event_name == 'push'
        run: make test-unit-coverage
