name: "Smoke: Connection Dialog → Auth Tab Switching"
on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-scheduled-audit.lock.yml@main
    with:
      title-prefix: "[smoke-auth-tab-switch]"
      setup-commands: |
        make setup
        cd peek && npx playwright install chromium
      additional-instructions: |
        You are the Playwright Smoke Agent for auth tab switching.
        Validate only this smoke scenario from `peek/tests/e2e/smoke.spec.ts`:
        - `security-focused user validates auth tab switching before submitting credentials`

        User flow to validate in detail:
        1. Open the connection dialog from the welcome screen.
        2. Confirm API key auth fields are shown first.
        3. Switch to Username / Password and verify username input appears.
        4. Switch back to API Key and verify the API key input is restored.
        5. Treat this as a security UX sanity check before cluster login.

        Run:
        1. `cd peek && npx playwright test tests/e2e/smoke.spec.ts --grep "security-focused user validates auth tab switching before submitting credentials"`

        If the check fails, create/update one issue with:
        - the failing test title and assertion/locator output
        - command output needed to reproduce
        - any screenshot/preflight diagnostics path you generated

        If the check passes, do not open an issue.
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
