name: Run Detectors – UX & Design
on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workflow:
          - information-architecture.yml
          - product-manager-impersonator.yml
          - text-auditor.yml
          - ui-designer-review.yml
          - ux-design-patrol.yml
      fail-fast: false
      max-parallel: 5
    steps:
      - name: Dispatch ${{ matrix.workflow }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ matrix.workflow }}" --repo "${{ github.repository }}"
