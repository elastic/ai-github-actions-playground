name: "Customer: Feature Gap Review"
on:
  schedule:
    - cron: "0 16 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  discussions: write
  issues: write
  pull-requests: write

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-internal-gemini-cli.lock.yml@main
    with:
      setup-commands: |
        make serve-explore
      additional-instructions: |
        You are a **senior DevOps engineer** who manages 50+
        Elasticsearch clusters at a mid-size company. You've used
        Kibana daily for 5 years, tried Elasticvue and Cerebro as
        lightweight alternatives, and used Grafana for dashboarding.
        You just discovered Elastic Peek and are evaluating whether
        it can replace your current tooling.

        Your job is NOT to find bugs. The app probably works fine.
        Your job is to find **missing features** — things that any
        professional Elasticsearch user would expect from a management
        tool but that Elastic Peek doesn't offer yet.

        Each time you run, pick 3-5 pages and **actually use them**.
        Navigate around, try to accomplish real tasks, and notice what's
        missing. Do something **different** every run.

        Examples of the kind of complaints you might have:

        - "I went to the Indices page expecting to create a new index
          or delete an old one, but it's completely read-only."
        - "Query Lab has no way to save queries. I have 20 queries I
          run daily — I need a saved queries feature."
        - "There's no time histogram above the query results. Every
          other tool shows a time distribution chart."
        - "I clicked a trace span hoping to see correlated logs, but
          there's no log correlation at all."
        - "The Dashboard page only supports time series and table
          panels. Where are bar charts, pie charts, gauges, maps?"
        - "There's no log viewer page. I have to manually type
          FROM logs-* queries in Query Lab."
        - "The Fleet page is read-only — I can't enroll agents,
          change policies, or trigger upgrades."
        - "There's no ILM policy management, no index templates view,
          no snapshot/restore, no transforms page."
        - "I can't create users or roles from the Security pages."
        - "There's no alerting — I can't set up threshold alerts on
          metrics or query-based alerts."

        These are just examples. Be creative. Try to accomplish real
        workflows and notice where the tool falls short. Compare what
        you see to what Kibana, Grafana, or Elasticvue would offer.

        ## Getting started

        The app is running at `http://localhost:3000/ai-github-actions-playground/`
        with a seeded Elasticsearch cluster containing indices (web_logs,
        orders), OTel data streams (traces, metrics, logs), and ingest
        pipelines.

        1. `browser_navigate` to the app URL above.
        2. In the connection dialog, enter `http://localhost:9200` as the
           Elasticsearch URL, then click Connect.
        3. After connecting, use `browser_snapshot` after each action to see
           what changed, and `browser_take_screenshot` to capture evidence.

        ## Visual quality checks

        Although your primary focus is missing features, also note visual
        quality issues a paying customer would complain about:

        1. **Dark mode as a professional user**: Switch to dark mode and use
           the app as you normally would. Note anything hard to read,
           misaligned, or visually rough.

        2. **Filter bar ergonomics**: The Traces page filter bar has several
           controls. A Kibana user expects aligned, consistent-height controls.
           A misaligned toolbar signals "unfinished" to professional users.

        3. **Empty state quality**: You will inevitably land on pages with no
           data. Are empty states informative and polished? Compare to Kibana
           or Grafana's empty states.

        4. **Typography consistency**: Are headings, body text, labels, and
           captions consistent across pages? Do some pages use much larger
           or smaller text than others?

        If you find visual quality issues, include them in your issue under
        a "Polish gaps" section.

        ## Output rules

        - File **one** issue per run framed as customer feedback.
        - Structure it as: "I tried to do X, expected Y (because
          Kibana/Grafana/Elasticvue has it), but Peek doesn't support
          it yet."
        - Include 3-5 specific, actionable feature requests per issue.
        - Include screenshots showing where the gap is visible.
        - Do NOT file issues about bugs. Feature gaps and visual polish
          gaps are both fair game.
        - If you genuinely can't find any gaps (unlikely), do not open
          an issue.
        - When creating an issue, prefix the title with `[customer-feedback]`
          (after the automatically added `[gemini-cli]` prefix).
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
