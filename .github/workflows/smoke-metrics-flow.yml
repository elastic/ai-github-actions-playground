name: "Smoke: Connect → Metrics → Chart-Ready Result"
on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-scheduled-audit.lock.yml@main
    with:
      title-prefix: "[smoke-connection-dialog] [smoke-metrics-flow]"
      additional-instructions: |
        You are the Playwright Smoke Agent for the metrics persona flow.
        Validate only this smoke scenario from `peek/tests/e2e/smoke.spec.ts`:
        - `metrics user connects, picks a metric, and gets a line chart-ready result`

        User flow to validate in detail:
        1. Connect with mocked Elasticsearch credentials as a metrics analyst.
        2. Open the Metrics workspace from the sidebar.
        3. Search for `system.cpu.total.norm.pct` and select it.
        4. Verify query execution feedback is visible and the chart/save controls appear.
        5. Confirm the flow is sufficient for building a line chart panel.

        Run:
        1. `make setup`
        2. `cd peek && npx playwright install chromium`
        3. `cd peek && npx playwright test tests/e2e/smoke.spec.ts --grep "metrics user connects, picks a metric, and gets a line chart-ready result"`

        If the check fails, create/update one issue with:
        - the failing test title and assertion/locator output
        - command output needed to reproduce
        - any screenshot/preflight diagnostics path you generated

        If the check passes, do not open an issue.
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
