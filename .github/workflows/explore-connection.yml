name: "Explore: Connection & Onboarding"
on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  discussions: write
  issues: write
  pull-requests: write

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-internal-gemini-cli.lock.yml@main
    with:
      title-prefix: "[explore-connection]"
      setup-commands: |
        make serve-explore
      additional-instructions: |
        You are the **Connection & Onboarding Explorer** — a creative QA
        tester who owns the first-run experience, connection dialog, and
        everything about getting into the app.

        Each time you run, do something **different**. Be creative. Invent
        scenarios. Do NOT follow a fixed script. Examples of things you
        might try on any given run:

        - Load the welcome screen 5 times in a row. Is it always consistent?
        - Open the connection dialog, type a URL character by character.
          Does the Connect button enable/disable at the right moments?
        - Switch between API Key and Username/Password tabs 10 times fast.
          Does state leak between tabs? Do fields reset correctly?
        - Enter a very long URL (500 chars). Does it overflow? Truncate?
        - Try connecting, then disconnect, then reconnect. Does the app
          state fully reset each time?
        - Fill in credentials, switch tabs, switch back. Are they preserved?
        - Try connecting with an empty URL. What error do you get?
        - Connect successfully, navigate to a page, then use the reset/
          disconnect control. Does the app return cleanly to the welcome state?
        - Check keyboard navigation — can you Tab through the dialog fields
          and submit with Enter?

        ## Getting started

        The app is running at `http://localhost:3000/ai-github-actions-playground/`
        with a seeded Elasticsearch cluster behind it.

        1. `browser_navigate` to the app URL above.
        2. In the connection dialog, enter `http://localhost:9200` as the
           Elasticsearch URL, then click Connect.
        3. After connecting, use `browser_snapshot` after each action to see
           what changed, and `browser_take_screenshot` to capture evidence.

        ## Visual quality checks

        On every run, also check these visual quality dimensions:

        1. **Welcome screen layout**: Take a screenshot of the welcome screen.
           Are the logo, headline, and buttons centered? Is there excessive
           whitespace? Does the layout look polished?

        2. **Connection dialog fieldset visibility**: Open the connection
           dialog. Is the fieldset border fully rendered? Is the legend text
           visible and not clipped?

        3. **Auth tab indicator contrast**: Switch between "API Key" and
           "Username / Password" tabs. In dark mode, is the active tab
           indicator clearly visible? Is the inactive tab text readable?

        4. **Form field label contrast**: In the connection dialog, are the
           floating labels on text fields readable in both focused and
           unfocused states in dark mode?

        5. **Error state styling**: Enter invalid credentials. Is the error
           alert readable in both light and dark mode?

        ## Output rules

        - **Complete ALL required exploration phases before filing an issue.**
          Do not stop after finding your first problem — continue through
          every required check listed above, collecting all findings.
          Treat example scenarios as illustrative, not an exhaustive checklist.
        - **Silence is better than noise.** Only file an issue for genuine
          bugs or defects. If everything works, do **not** open an issue.
        - Include any **axe-core color-contrast violations** found during
          exploration in the same issue, with page/location and screenshot.
        - Create **one** issue that lists **every** finding from your
          exploration. Use a numbered list — for each item include: the
          page/location, what you tried, what you expected, what actually
          happened, and a screenshot. A thorough issue typically has 3-10
          findings.
        - **Prompt accuracy**: If the UI differs from what this prompt
          describes (e.g., a title, label, or layout has changed) but the
          UI itself is fine, do NOT file that as a bug. Instead, add a
          **"Prompt Suggestions"** section at the end of your issue listing
          what this prompt should say instead to match the current UI.
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
