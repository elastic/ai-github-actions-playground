name: PR Control Panel

# Security note:
# - This workflow uses pull_request_target so it can write PR comments/labels.
# - It must never execute untrusted PR code. Keep it API-only (no checkout of PR head).
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync-control-panel:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.sender.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Sync control panel via GitHub API only (no checkout)
        uses: actions/github-script@v7
        env:
          CONTROL_PANEL_ITEMS: |
            no-pr-actions-detective|Investigate CI Failures|Posts a quick diagnosis and suggested fixes when PR checks fail, so recovery is faster.|fbca04|Disable PR Actions Detective workflow
            no-pr-review|Run an extra, in-depth, PR Review|Runs the automated PR reviewer to surface bugs, risks, and maintainability issues earlier.|0e8a16|Disable PR Review workflow
            no-update-pr-body|Keep the body of the PR updated|Keeps the PR description aligned with the latest commits so reviewers have accurate context.|1d76db|Disable Update PR Body workflow
            no-address-pr-feedback|Address review feedback|Applies straightforward bot review suggestions automatically to reduce manual cleanup.|5319e7|Disable Address PR Review Feedback workflow
            no-address-merge-conflicts|Address merge conflicts|Automatically resolves simple main-branch merge conflicts so the PR stays mergeable.|d73a4a|Disable Address Merge Conflicts workflow
          CONTROL_PANEL_ADVANCED_ITEMS: |
            no-pr-preview|Enable PR Preview deployment|Opt out of this to skip PR preview deployment when preview workflows are configured to honor the label.|0366d6|Disable PR Preview deployment
        with:
          script: |
            // Security invariant for pull_request_target:
            // this script only reads GitHub event/API data and writes labels/comments.
            // Do not run code from the PR branch in this workflow.
            const MARKER = "<!-- pr-control-panel -->";
            const KEY_PREFIX = "label";
            const CONFIG_DELIMITER = "|";

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            function escapeHtml(value) {
              return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
            }

            function parseItemsConfig(raw, configName) {
              const lines = raw
                .split("\n")
                .map((line) => line.trim())
                .filter(Boolean);
              if (lines.length === 0) return [];
              return lines.map((line) => {
                const parts = line.split(CONFIG_DELIMITER).map((part) => part.trim());
                if (parts.length !== 5) {
                  throw new Error(
                    `Invalid ${configName} line (expected 5 fields): ${line}`,
                  );
                }
                const [label, title, tooltip, color, description] = parts;
                return {
                  label,
                  title,
                  tooltip,
                  color,
                  description,
                  displayLabel: `<span title='${escapeHtml(tooltip)}'>${escapeHtml(title)}</span>`,
                };
              });
            }

            const PRIMARY_ITEMS = parseItemsConfig(
              process.env.CONTROL_PANEL_ITEMS ?? "",
              "CONTROL_PANEL_ITEMS",
            );
            const ADVANCED_ITEMS = parseItemsConfig(
              process.env.CONTROL_PANEL_ADVANCED_ITEMS ?? "",
              "CONTROL_PANEL_ADVANCED_ITEMS",
            );
            const ITEMS = [...PRIMARY_ITEMS, ...ADVANCED_ITEMS];
            if (PRIMARY_ITEMS.length === 0) {
              throw new Error("CONTROL_PANEL_ITEMS must include at least one item.");
            }

            function readCheckboxByKey(body, key) {
              const escaped = key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const checked = new RegExp(
                `- \\[[xX]\\][^\\n]*<!--\\s*${KEY_PREFIX}:${escaped}\\s*-->`,
              ).test(body);
              const unchecked = new RegExp(
                `- \\[ \\][^\\n]*<!--\\s*${KEY_PREFIX}:${escaped}\\s*-->`,
              ).test(body);
              if (checked) return true;
              if (unchecked) return false;
              return null;
            }

            function buildControlPanelBody(state) {
              return [
                MARKER,
                "Automatically handle the following tasks using AI:",
                "",
                ...PRIMARY_ITEMS.map(
                  (item) =>
                    `- [${state[item.label] ? "x" : " "}] ${item.displayLabel} <!-- ${KEY_PREFIX}:${item.label} -->`,
                ),
                "",
                ...(ADVANCED_ITEMS.length > 0
                  ? [
                      "<details>",
                      "<summary>Advanced controls</summary>",
                      "",
                      ...ADVANCED_ITEMS.map(
                        (item) =>
                          `- [${state[item.label] ? "x" : " "}] ${item.displayLabel} <!-- ${KEY_PREFIX}:${item.label} -->`,
                      ),
                      "",
                      "</details>",
                      "",
                    ]
                  : []),
                "<details>",
                "<summary>Troubleshooting</summary>",
                "",
                "This control panel only adds or removes labels on the PR.",
                "It does not directly start workflows.",
                "If you toggle an option, related automation may not run until its next normal trigger event.",
                "</details>",
              ].join("\n");
            }

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error?.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color,
                  description,
                });
                core.info(`Created label: ${name}`);
              }
            }

            async function ensureControlLabels() {
              await Promise.all(
                ITEMS.map((item) => ensureLabel(item.label, item.color, item.description)),
              );
            }

            async function listComments(issueNumber) {
              return github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });
            }

            async function findControlPanelComment(issueNumber) {
              const comments = await listComments(issueNumber);
              return comments.find((comment) => comment.body?.includes(MARKER)) ?? null;
            }

            async function upsertControlPanel(issueNumber, state) {
              const body = buildControlPanelBody(state);
              const existing = await findControlPanelComment(issueNumber);
              if (existing) {
                if ((existing.body ?? "") === body) {
                  core.info(`Control panel comment ${existing.id} already up to date; skipping.`);
                  return existing.id;
                }
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
                core.info(`Updated control panel comment ${existing.id}`);
                return existing.id;
              }
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
              core.info(`Created control panel comment ${created.data.id}`);
              return created.data.id;
            }

            async function getPullRequest(prNumber) {
              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });
              return response.data;
            }

            async function syncLabelsFromState(issueNumber, labelSet, state) {
              async function addLabel(name) {
                if (labelSet.has(name)) return;
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: [name],
                });
                labelSet.add(name);
                core.info(`Added label: ${name}`);
              }

              async function removeLabel(name) {
                if (!labelSet.has(name)) return;
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    name,
                  });
                } catch (error) {
                  if (error?.status !== 404) throw error;
                }
                labelSet.delete(name);
                core.info(`Removed label: ${name}`);
              }

              for (const item of ITEMS) {
                if (state[item.label]) await removeLabel(item.label);
                else await addLabel(item.label);
              }
            }

            if (context.eventName === "pull_request_target") {
              const prNumber = context.payload.pull_request.number;
              await ensureControlLabels();
              const existing = await findControlPanelComment(prNumber);
              const labels = new Set((context.payload.pull_request.labels || []).map((l) => l.name));
              const hasAnyOptOutLabel = ITEMS.some((item) => labels.has(item.label));
              const state =
                existing || hasAnyOptOutLabel
                  ? Object.fromEntries(ITEMS.map((item) => [item.label, !labels.has(item.label)]))
                  : Object.fromEntries(ITEMS.map((item) => [item.label, true]));
              await syncLabelsFromState(prNumber, labels, state);
              await upsertControlPanel(prNumber, state);
              return;
            }

            // issue_comment path (PR-only due job if guard)
            const issueNumber = context.payload.issue.number;
            const commentBody = context.payload.comment.body || "";
            if (!commentBody.includes(MARKER)) {
              core.info("Edited comment is not the control panel comment; skipping.");
              return;
            }

            await ensureControlLabels();
            const pr = await getPullRequest(issueNumber);
            const labels = new Set((pr.labels || []).map((l) => l.name));
            const currentState = Object.fromEntries(
              ITEMS.map((item) => [item.label, !labels.has(item.label)]),
            );
            const desiredState = Object.fromEntries(
              ITEMS.map((item) => [
                item.label,
                readCheckboxByKey(commentBody, item.label) ?? currentState[item.label],
              ]),
            );

            await syncLabelsFromState(issueNumber, labels, desiredState);
            await upsertControlPanel(issueNumber, desiredState);
