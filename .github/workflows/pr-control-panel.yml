name: PR Control Panel

# Security note:
# - This workflow uses pull_request_target so it can write PR comments/labels.
# - It must never execute untrusted PR code. Keep it API-only (no checkout of PR head).
on:
  pull_request_target:
    types: [opened, reopened, labeled, unlabeled]
  issue_comment:
    types: [edited]

concurrency:
  group: pr-control-panel-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync-control-panel:
    if: >-
      (github.event_name == 'pull_request_target' &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
        contains(fromJSON('["Copilot","dependabot[bot]","github-actions[bot]"]'), github.event.pull_request.user.login))) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.sender.login != 'github-actions[bot]' &&
       contains(github.event.comment.body, '<!-- pr-control-panel -->'))
    runs-on: ubuntu-latest
    steps:
      - name: Sync control panel via GitHub API only (no checkout)
        uses: actions/github-script@v7
        env:
          CONTROL_PANEL_ITEMS: |
            no-pr-actions-detective|Investigate CI Failures|Posts a quick diagnosis and suggested fixes when PR checks fail, so recovery is faster.|fbca04|Disable PR Actions Detective workflow
            no-pr-review|Run an extra, in-depth, PR Review|Runs the automated PR reviewer to surface bugs, risks, and maintainability issues earlier.|0e8a16|Disable PR Review workflow
            no-pr-labeler|Auto-label pull requests|Applies one size/risk classification label to help triage and route reviews.|2f855a|Disable PR Labeler workflow
            no-update-pr-body|Keep the body of the PR updated|Keeps the PR description aligned with the latest commits so reviewers have accurate context.|1d76db|Disable Update PR Body workflow
            no-address-pr-feedback|Address review feedback|Applies straightforward bot review suggestions automatically to reduce manual cleanup.|5319e7|Disable Address PR Review Feedback workflow
            no-address-merge-conflicts|Address merge conflicts|Automatically resolves simple main-branch merge conflicts so the PR stays mergeable.|d73a4a|Disable Address Merge Conflicts workflow
          CONTROL_PANEL_ITEMS_FORK: |
            no-pr-actions-detective|Investigate CI Failures|Posts a quick diagnosis and suggested fixes when PR checks fail, so recovery is faster.|fbca04|Disable PR Actions Detective workflow
            no-pr-review|Run an extra, in-depth, PR Review|Runs the automated PR reviewer to surface bugs, risks, and maintainability issues earlier.|0e8a16|Disable PR Review workflow
            no-pr-labeler|Auto-label pull requests|Applies one size/risk classification label to help triage and route reviews.|2f855a|Disable PR Labeler workflow
            no-update-pr-body|Keep the body of the PR updated|Keeps the PR description aligned with the latest commits so reviewers have accurate context.|1d76db|Disable Update PR Body workflow
          CONTROL_PANEL_ADVANCED_ITEMS: |
            no-pr-preview|Enable PR Preview deployment|Opt out of this to skip PR preview deployment when preview workflows are configured to honor the label.|0366d6|Disable PR Preview deployment
        with:
          script: |
            // Security invariant for pull_request_target:
            // this script only reads GitHub event/API data and writes labels/comments.
            // Do not run code from the PR branch in this workflow.
            const MARKER = "<!-- pr-control-panel -->";
            const KEY_PREFIX = "label";
            const CONFIG_DELIMITER = "|";
            const FORK_FORCED_DISABLED_LABELS = [
              "no-address-pr-feedback",
              "no-address-merge-conflicts",
            ];

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            function escapeHtml(value) {
              return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
            }

            function parseItemsConfig(raw, configName) {
              const lines = raw
                .split("\n")
                .map((line) => line.trim())
                .filter(Boolean);
              if (lines.length === 0) return [];
              return lines.map((line) => {
                const parts = line.split(CONFIG_DELIMITER).map((part) => part.trim());
                if (parts.length !== 5) {
                  throw new Error(
                    `Invalid ${configName} line (expected 5 fields): ${line}`,
                  );
                }
                const [label, title, tooltip, color, description] = parts;
                return {
                  label,
                  title,
                  tooltip,
                  color,
                  description,
                  displayLabel: `<span title='${escapeHtml(tooltip)}'>${escapeHtml(title)}</span>`,
                };
              });
            }

            const PRIMARY_ITEMS = parseItemsConfig(
              process.env.CONTROL_PANEL_ITEMS ?? "",
              "CONTROL_PANEL_ITEMS",
            );
            const FORK_PRIMARY_ITEMS = parseItemsConfig(
              process.env.CONTROL_PANEL_ITEMS_FORK ?? "",
              "CONTROL_PANEL_ITEMS_FORK",
            );
            const ADVANCED_ITEMS = parseItemsConfig(
              process.env.CONTROL_PANEL_ADVANCED_ITEMS ?? "",
              "CONTROL_PANEL_ADVANCED_ITEMS",
            );
            const ITEMS = [...PRIMARY_ITEMS, ...ADVANCED_ITEMS];
            const FORK_ITEMS = [...FORK_PRIMARY_ITEMS, ...ADVANCED_ITEMS];
            const ALL_ITEMS = [
              ...new Map([...ITEMS, ...FORK_ITEMS].map((item) => [item.label, item])).values(),
            ];
            if (PRIMARY_ITEMS.length === 0) {
              throw new Error("CONTROL_PANEL_ITEMS must include at least one item.");
            }
            if (FORK_PRIMARY_ITEMS.length === 0) {
              throw new Error("CONTROL_PANEL_ITEMS_FORK must include at least one item.");
            }

            function isForkPullRequest(pr) {
              const baseRepoFullName = `${owner}/${repo}`;
              return pr?.head?.repo?.full_name !== baseRepoFullName;
            }

            function readCheckboxByKey(body, key) {
              const escaped = key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const checked = new RegExp(
                `- \\[[xX]\\][^\\n]*<!--\\s*${KEY_PREFIX}:${escaped}\\s*-->`,
              ).test(body);
              const unchecked = new RegExp(
                `- \\[ \\][^\\n]*<!--\\s*${KEY_PREFIX}:${escaped}\\s*-->`,
              ).test(body);
              if (checked) return true;
              if (unchecked) return false;
              return null;
            }

            function buildControlPanelBody(primaryItems, advancedItems, state, isForkPr) {
              const managedItems = [...primaryItems, ...advancedItems];
              const enabledItems = managedItems.filter((item) => state[item.label]);
              const disabledItems = managedItems.filter((item) => !state[item.label]);
              return [
                MARKER,
                "🤖 AI Assistant 🤖",
                "",
                "<details>",
                `<summary>${enabledItems.length} Enabled Automations • ${disabledItems.length} Disabled Automations</summary>`,
                "",
                ...(enabledItems.length > 0
                  ? [
                      "**Enabled automations**",
                      "",
                      ...enabledItems.map(
                        (item) =>
                          `- [${state[item.label] ? "x" : " "}] ${item.displayLabel} <!-- ${KEY_PREFIX}:${item.label} -->`,
                      ),
                      "",
                    ]
                  : []),
                ...(disabledItems.length > 0
                  ? [
                      "**Disabled automations**",
                      "",
                      ...disabledItems.map(
                        (item) =>
                          `- [${state[item.label] ? "x" : " "}] ${item.displayLabel} <!-- ${KEY_PREFIX}:${item.label} -->`,
                      ),
                      "",
                    ]
                  : []),
                "</details>",
                "",
                "<details>",
                "<summary>Troubleshooting</summary>",
                "",
                ...(isForkPr
                  ? [
                      "Fork PR detected: controls that require pushing commits are intentionally disabled.",
                      "",
                    ]
                  : []),
                "This control panel only adds or removes labels on the PR.",
                "It does not directly start workflows.",
                "If you toggle an option, related automation may not run until its next normal trigger event.",
                "",
                "- [ ] Re-sync control panel from labels <!-- action:reset -->",
                "</details>",
              ].join("\n");
            }

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error?.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color,
                  description,
                });
                core.info(`Created label: ${name}`);
              }
            }

            async function ensureControlLabels() {
              await Promise.all(
                ALL_ITEMS.map((item) => ensureLabel(item.label, item.color, item.description)),
              );
            }

            async function listComments(issueNumber) {
              return github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });
            }

            async function findControlPanelComment(issueNumber) {
              const comments = await listComments(issueNumber);
              return comments.find((comment) => comment.body?.includes(MARKER)) ?? null;
            }

            async function upsertControlPanel(issueNumber, panelConfig, state) {
              const body = buildControlPanelBody(
                panelConfig.primaryItems,
                panelConfig.advancedItems,
                state,
                panelConfig.isForkPr,
              );
              const existing = await findControlPanelComment(issueNumber);
              if (existing) {
                if ((existing.body ?? "") === body) {
                  core.info(`Control panel comment ${existing.id} already up to date; skipping.`);
                  return existing.id;
                }
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
                core.info(`Updated control panel comment ${existing.id}`);
                return existing.id;
              }
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
              core.info(`Created control panel comment ${created.data.id}`);
              return created.data.id;
            }

            async function getPullRequest(prNumber) {
              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });
              return response.data;
            }

            function getPanelConfig(pr) {
              const isForkPr = isForkPullRequest(pr);
              if (!isForkPr) {
                return {
                  isForkPr,
                  primaryItems: PRIMARY_ITEMS,
                  advancedItems: ADVANCED_ITEMS,
                  managedItems: ITEMS,
                  forcedDisabledLabels: [],
                };
              }
              return {
                isForkPr,
                primaryItems: FORK_PRIMARY_ITEMS,
                advancedItems: ADVANCED_ITEMS,
                managedItems: FORK_ITEMS,
                forcedDisabledLabels: FORK_FORCED_DISABLED_LABELS,
              };
            }

            async function syncLabelsFromState(issueNumber, labelSet, state, panelConfig) {
              async function addLabel(name) {
                if (labelSet.has(name)) return;
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: [name],
                });
                labelSet.add(name);
                core.info(`Added label: ${name}`);
              }

              async function removeLabel(name) {
                if (!labelSet.has(name)) return;
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    name,
                  });
                } catch (error) {
                  if (error?.status !== 404) throw error;
                }
                labelSet.delete(name);
                core.info(`Removed label: ${name}`);
              }

              for (const item of panelConfig.managedItems) {
                if (state[item.label]) await removeLabel(item.label);
                else await addLabel(item.label);
              }

              for (const label of panelConfig.forcedDisabledLabels) {
                await addLabel(label);
              }
            }

            if (context.eventName === "pull_request_target") {
              const pr = context.payload.pull_request;
              const panelConfig = getPanelConfig(pr);
              const prNumber = pr.number;
              await ensureControlLabels();
              const existing = await findControlPanelComment(prNumber);
              const labels = new Set((pr.labels || []).map((l) => l.name));
              const relevantLabels = [
                ...panelConfig.managedItems.map((item) => item.label),
                ...panelConfig.forcedDisabledLabels,
              ];
              const hasAnyOptOutLabel = relevantLabels.some((label) => labels.has(label));
              const state =
                existing || hasAnyOptOutLabel
                  ? Object.fromEntries(
                      panelConfig.managedItems.map((item) => [item.label, !labels.has(item.label)]),
                    )
                  : Object.fromEntries(panelConfig.managedItems.map((item) => [item.label, true]));
              await syncLabelsFromState(prNumber, labels, state, panelConfig);
              await upsertControlPanel(prNumber, panelConfig, state);
              return;
            }

            // issue_comment path (PR-only due job if guard)
            const issueNumber = context.payload.issue.number;
            const commentBody = context.payload.comment.body || "";
            if (!commentBody.includes(MARKER)) {
              core.info("Edited comment is not the control panel comment; skipping.");
              return;
            }
            const commentAuthor = context.payload.comment?.user?.login ?? "";
            if (commentAuthor !== "github-actions[bot]") {
              core.warning(`Ignoring control-panel edit from non-bot comment (author: ${commentAuthor})`);
              return;
            }

            await ensureControlLabels();
            const pr = await getPullRequest(issueNumber);
            const panelConfig = getPanelConfig(pr);
            const labels = new Set((pr.labels || []).map((l) => l.name));

            // Check if the reset toggle was checked
            const resetRequested = /- \[[xX]\][^\n]*<!--\s*action:reset\s*-->/.test(commentBody);

            // Labels are always the baseline; checkboxes override unless resetting
            const labelState = Object.fromEntries(
              panelConfig.managedItems.map((item) => [item.label, !labels.has(item.label)]),
            );
            const desiredState = resetRequested
              ? labelState
              : Object.fromEntries(
                  panelConfig.managedItems.map((item) => [
                    item.label,
                    readCheckboxByKey(commentBody, item.label) ?? labelState[item.label],
                  ]),
                );

            if (resetRequested) {
              core.info("Reset requested — rebuilding control panel from labels");
            }

            await syncLabelsFromState(issueNumber, labels, desiredState, panelConfig);
            await upsertControlPanel(issueNumber, panelConfig, desiredState);
