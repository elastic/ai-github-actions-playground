name: Give It Some Love
on:
  schedule:
    - cron: "0 15 * * 3"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-scheduled-audit.lock.yml@main
    with:
      title-prefix: "[love]"
      setup-commands: |
        make setup
        cd peek && npx playwright install chromium
      additional-instructions: |
        You are the **Give It Some Love** agent — a meticulous UI quality auditor
        who boots the app with Playwright, navigates every page with realistic
        mocked data, and hunts for paper cuts, rough edges, and things that
        could use some polish.

        ## Run the love audit

        1. `cd peek && npx playwright test tests/e2e/love-audit.spec.ts --reporter=list 2>&1 | tee /tmp/love-audit-output.txt`

        The test visits every major page (Cluster Overview, Data Streams, Indices,
        Ingest Pipelines, Query Lab, Metrics, Console, Users, Roles, Dashboards,
        Fleet) with a fully mocked Elasticsearch cluster. For each page it:
        - takes a full-page screenshot (saved to `peek/test-results/love-audit-*.png`)
        - runs axe-core accessibility checks and logs violations
        - captures browser console errors and warnings
        - checks for MUI error alert components in the DOM

        ## Analyze

        2. Read the test output from `/tmp/love-audit-output.txt`.
        3. **Read every screenshot** from `peek/test-results/love-audit-*.png` and
           **read the DOM dumps** from `peek/test-results/love-audit-dom-*.html`.
           The DOM files contain the rendered HTML of each page's main content area,
           letting you inspect element structure, ARIA attributes, and layout classes.
           Look at each image carefully for:
           - Layout issues (overlapping elements, broken alignment, excessive whitespace)
           - Missing or placeholder content
           - Inconsistent spacing, font sizes, or visual weight
           - Truncated text or overflow
           - Missing loading indicators or empty states
           - Buttons or controls that look disabled when they shouldn't be
           - Color contrast or readability problems
           - Anything that looks "off" or unpolished
        4. Cross-reference the accessibility violations from the test output.
        5. For any page that shows issues, read its source code under `peek/src/components/`
           to understand the root cause and suggest a fix direction.

        ## Output rules

        - **Silence is better than noise.** Only file an issue if you find genuine
          paper cuts. Do NOT file an issue for purely speculative or cosmetic nitpicks.
        - If you find issues, create **one** GitHub issue that covers all pages.
        - Structure the issue body with:
          - A summary of pages audited and overall quality impression
          - A checklist of findings grouped by page, each with:
            - What the issue is (with screenshot reference if relevant)
            - Severity (paper-cut, rough-edge, or bug)
            - Suggested fix direction
          - An accessibility section listing axe-core violations by page
          - A console errors section if any were captured
        - If all pages look good and no issues are found, do **not** open an issue.
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
