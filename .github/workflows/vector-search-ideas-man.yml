name: Vector Search Ideas Man
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-product-manager-impersonator.lock.yml@main
    with:
      persona: "a search engineer and AI product builder who tunes relevance, embedding pipelines, and hybrid retrieval strategies"
      idea-size: "small"
      title-prefix: "[search idea]"
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
