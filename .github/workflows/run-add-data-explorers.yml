name: Run Add Data Explorers
on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workflow:
          - explore-add-data.yml
          - explore-add-data-alex.yml
          - explore-add-data-jordan.yml
          - explore-add-data-morgan.yml
          - explore-add-data-riley.yml
          - explore-add-data-sam.yml
          - explore-fleet-add-data.yml
      fail-fast: false
      max-parallel: 5
    steps:
      - name: Dispatch ${{ matrix.workflow }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ matrix.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
