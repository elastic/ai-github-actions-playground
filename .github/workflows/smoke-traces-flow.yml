name: "Smoke: Connect → Traces → Service Map → Query Lab"
on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-scheduled-audit.lock.yml@main
    with:
      title-prefix: "[smoke-connect-button-enablement] [smoke-traces-flow]"
      additional-instructions: |
        You are the Playwright Smoke Agent for the traces persona flow.
        Validate only this smoke scenario from `peek/tests/e2e/smoke.spec.ts`:
        - `traces user opens a trace and pivots from service map context into Query Lab`

        User flow to validate in detail:
        1. Connect using mocked Elasticsearch responses.
        2. Navigate to Traces and run search to load trace rows.
        3. Click a trace row to load span details.
        4. Switch to Service Map to validate trace topology rendering.
        5. Click "Open in Query Lab" to pivot investigation into query workflow.

        Run:
        1. `make setup`
        2. `cd peek && npx playwright install chromium`
        3. `cd peek && npx playwright test tests/e2e/smoke.spec.ts --grep "traces user opens a trace and pivots from service map context into Query Lab"`

        If the check fails, create/update one issue with:
        - the failing test title and assertion/locator output
        - command output needed to reproduce
        - any screenshot/preflight diagnostics path you generated

        If the check passes, do not open an issue.
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
