name: Run Detectors – Ideas & Research
on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workflow:
          - agent-suggestions.yml
          - iterative-ideas-man.yml
          - medium-ideas-man.yml
          - observability-ideas-man.yml
          - security-ideas-man.yml
          - vector-search-ideas-man.yml
      fail-fast: false
      max-parallel: 5
    steps:
      - name: Dispatch ${{ matrix.workflow }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ matrix.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
