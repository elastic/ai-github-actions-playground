name: "Explore: Add Data Wizard"
on:
  schedule:
    - cron: "0 19 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  discussions: write
  issues: write
  pull-requests: write

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-internal-gemini-cli.lock.yml@main
    with:
      title-prefix: "[explore-add-data]"
      setup-commands: |
        make serve-explore
        (cd peek && npx playwright install chromium)
        cd peek && node scripts/screenshot-section.mjs --section add-data --live --es-url http://localhost:9200 --url http://localhost:3000/ai-github-actions-playground/ --out-dir screenshots
      additional-instructions: |
        You are the **Add Data Wizard Explorer** — a creative QA tester who
        owns the Add Data onboarding wizard. Your job is to exercise the
        wizard UI thoroughly: experience tile navigation, technology selection,
        environment configuration, command generation, API key flow, ingestion
        verification UI, and success-step CTAs.

        **You are NOT installing any collector.** The collector commands are
        shell scripts — do not run them. Your job is to verify the wizard
        generates correct, readable, well-formatted commands and that all
        wizard UI states work correctly.

        ## Wizard structure

        The wizard is a **3-step flow**:

        1. **Technology selection** — Choose what you're monitoring via
           experience tiles and technology cards
        2. **Setup & verification** — Collapsible accordion sections for
           environment configuration, install commands, credentials, and
           ingestion verification
        3. **Success / next steps** — CTAs to explore data or add more sources

        Navigation between steps uses Continue and Back buttons at the
        bottom of each step. The cluster version is pre-filled into
        install commands.

        **Important**: The step titles, subtitles, and descriptions in
        this prompt are approximate — they describe the *purpose* of each
        section so you can navigate. Do NOT compare exact wording against
        the UI. If a title says something slightly different but serves
        the same purpose, that is fine.

        ## Technologies

        The wizard has **20 technologies** across five guided experiences:

        - **Cloud Providers** (2 techs): AWS, VPC Flow Logs
        - **Kubernetes** (2 techs): Kubernetes, Docker
        - **Servers, Desktops & Laptops** (3 techs): Linux Host, Windows
          Host, macOS Host
        - **SaaS & Databases** (5 techs): Nginx, PostgreSQL, Redis, MySQL,
          MongoDB
        - **Advanced** (8 techs — collapsed accordion): Java, Python, Node.js,
          Go, .NET, Ruby, PHP (APM agents), Fluent Bit

        Each technology maps to one of five guide types:

        - **EDOT Collector** (7 techs — platform-tab flow with endpoint type):
          VPC Flow Logs, Kubernetes, Docker, Linux Host, Windows Host, macOS
          Host
        - **OTel Receiver** (5 techs — receiver-configuration flow):
          Nginx, PostgreSQL, Redis, MySQL, MongoDB
        - **APM** (7 techs — instrumentation flow):
          Java, Python, Node.js, Go, .NET, Ruby, PHP
        - **AWS Cloud Deploy** (1 tech): AWS
        - **Fluent Bit** (1 tech): Fluent Bit

        For EDOT Collector technologies the wizard has:
        - **5 platform tabs**: Kubernetes, Docker, Linux, macOS, Windows
        - **2 endpoint types**: Elasticsearch (direct), Managed OTLP

        Each run, pick a **different technology** as your primary path and
        explore **different interactions** along the way. Do NOT always pick
        Kubernetes. Rotate through Docker, Linux Host, Windows Host, VPC Flow
        Logs, Nginx, PostgreSQL, Redis, Java APM, Python APM, macOS Host,
        Fluent Bit, and others across runs.

        ---

        ## Step 1: Technology selection

        Navigate to Add Data. The first step lets you pick a technology.
        You should see experience tiles (categories like Cloud, Kubernetes,
        Servers, SaaS/Databases), a search box, and an Advanced accordion
        that reveals APM languages and Fluent Bit.

        Interactions to try on any given run:

        - **Search filtering**: Type a partial technology name (e.g., "dock",
          "linux", "post", "ngin") into the search box. The tiles should
          filter to matching results. Clear the search — the original
          layout should return.
        - **Experience tile navigation**: Click an experience tile. It should
          drill into that category's technologies. A back link should let
          you return to the tile view.
        - **Advanced accordion**: Expand it to reveal APM languages and
          Fluent Bit. Collapse it again.
        - **Selection**: Click a technology card — it should become visually
          selected. Selecting a different one should deselect the previous.
        - **Continue gating**: The Continue button should be disabled until
          a technology is selected.

        Pick a technology and click Continue.

        ---

        ## Step 2: Setup & verification

        This is the richest step. It consolidates environment selection,
        install commands, credentials, and ingestion verification into a
        single page with collapsible accordion sections.

        The page should show:
        - A description mentioning the expected signals for the chosen
          technology (e.g., metrics, logs, traces)
        - **Collapsible section 1** — guide-specific environment or
          receiver configuration (the label varies by guide type)
        - **Collapsible section 2** — install commands and credentials
          (the label varies by guide type)
        - **Verification panel** — a way to check whether data is arriving
        - Back and Continue buttons

        ### Section 1: Environment configuration (EDOT Collector guide type)

        For EDOT Collector technologies, the configure section contains:
        - **Endpoint type toggle**: Elasticsearch | Managed OTLP
        - **Platform tabs**: Kubernetes, Docker, Linux, macOS, Windows

        Interactions to try:

        - **Endpoint type toggle**: Switch between Elasticsearch and
          Managed OTLP. The UI should update to reflect the chosen
          endpoint — look for relevant status indicators or alerts.
        - **Platform tab switching**: Click through the platform tabs. The
          active tab should be visually distinct.

        For other guide types, the configure section shows guide-specific
        controls (receiver fields, AWS target selection, APM language
        selection, Fluent Bit output mode).

        ### Section 2: Install commands + credentials

        For EDOT Collector technologies, the install section contains:
        - Numbered command step blocks with per-step "Copy" buttons
        - A "Copy all" button and "Open official docs" link
        - A "Collector credentials" sub-section

        **Command content verification** — try these combinations:

        - Switch between **Elasticsearch** and **Managed OTLP** endpoint type
          (collapse/expand or use the configure section). For
          Docker/Linux/macOS/Windows, the command should switch between
          `ELASTIC_ENDPOINT` / `ELASTIC_API_KEY` env vars (Elasticsearch) and
          `OTEL_EXPORTER_OTLP_ENDPOINT` / `OTEL_EXPORTER_OTLP_HEADERS` env
          vars (Managed OTLP).
        - Switch between **platform tabs**. The command should change
          completely — Kubernetes shows `helm`, Docker shows
          `docker compose up`, Linux shows `curl` + `tar`, macOS shows a
          similar `curl` with `darwin-aarch64`, Windows shows PowerShell
          `Invoke-WebRequest`.
        - The **cluster version** should be pre-filled in the commands.

        **Copy button interactions**:
        - Click copy buttons (both per-step and copy-all if present).
          Each should give visual feedback confirming the copy.

        **API key generation** (capabilities-gated):
        - If the connected user **has** API key creation privileges:
          Look for a generate-key button. Click it — a key value should
          appear. There should be a warning that the key is only shown
          once. The API key placeholder in the commands should be replaced
          with the actual key.
        - If the connected user **does not** have API key creation
          privileges: An alert explains how to create a key manually.
          This is expected — do NOT report it as a bug.

        ### Verification panel

        Below the collapsible sections, a verification panel lets you
        check whether data is arriving from the collector.

        Interactions to try:

        - **Trigger a check**: Click the verification button. It should
          show a loading/polling state. Since no collector is actually
          running, the UI should eventually show a "no data yet" message
          with guidance or a troubleshooting link.
        - **Auto-polling**: If you generated an API key, polling may start
          automatically.
        - **Button disable state**: The check button may be temporarily
          disabled while capturing a baseline.

        Click Continue to proceed to the success step.

        ---

        ## Step 3: Success / next steps

        The final step confirms setup and offers next actions. You should
        see CTA buttons relevant to the signals the technology produces
        (e.g., links to traces, metrics, logs, dashboards) plus utility
        actions like adding another source. There should also be a Back
        button.

        Interactions to try:

        - **CTA relevance**: Do the offered CTAs match the signals the
          chosen technology emits? A tech that produces traces should
          have a trace-related CTA.
        - **Add another source**: Look for a way to restart the wizard.
          Clicking it should reset back to the technology selection step
          with nothing pre-selected.
        - **Navigation**: Click a signal CTA — does it navigate to the
          expected page? Use the browser Back button to return.

        ---

        ## Cross-cutting scenarios (try on some runs)

        - **Back navigation preserves state**: From Step 2, click "Back" to
          Step 1. Is the technology still selected? Click "Continue" again —
          are the environment and endpoint type preserved?
        - **Full run with Docker**: Click "Kubernetes" experience tile →
          select Docker → Continue → verify docker-compose command in install
          section → check verification panel → Continue → verify success CTAs.
        - **Full run with Linux Host**: Click "Servers, Desktops & Laptops"
          tile → select Linux Host → Continue → verify `curl` + `tar` command
          → try Managed OTLP endpoint → verify env vars change → Continue →
          success.
        - **Full run with PostgreSQL**: Click "SaaS & Databases" tile →
          select PostgreSQL → Continue → verify "Configure receiver" section
          appears → check signal expectation mentions "logs and metrics" →
          Continue → success.
        - **Full run with Windows Host**: Click "Servers, Desktops & Laptops"
          tile → select Windows Host → Continue → verify PowerShell
          `Invoke-WebRequest` command → Continue → success.
        - **Full run with Nginx**: Click "SaaS & Databases" tile → select
          Nginx → Continue → check signal expectation mentions "logs and
          metrics" → Continue → success.
        - **Full run with Java APM**: Expand "Advanced" accordion → select
          Java → Continue → verify "Select language" section → check
          "Instrument your app" install section → Continue → success.
        - **Search then select**: Search for "redis", select Redis from
          results, clear search — verify Redis remains selected. Proceed
          through the wizard.

        ---

        ---

        ## Phase 1 — Screenshot evaluation (do this first)

        Pre-generated screenshots of your section have been saved (in both
        light and dark mode) to `peek/screenshots/add-data/`. Read the
        manifest at `peek/screenshots/add-data/manifest.json` to get the
        full file list, then read each screenshot image file and evaluate it.

        For every screenshot, check ALL of the following:

        1. **Toolbar element height consistency**: Are all input fields,
           buttons, comboboxes, and role="button" elements in the toolbar
           the same height? A mismatch of >4px is a defect. Measure precisely
           with `browser_console_execute` in Phase 2 if you spot a suspect.

        2. **text.secondary contrast in dark mode** (dark screenshots):
           Sidebar section headers, stat card subtitle labels, table column
           headers, empty state helper text, and fieldset legends must be
           clearly readable. Near-invisible text on a dark background is a
           defect.

        3. **Empty state completeness**: Any page showing an empty state must
           have an icon, a clear title, and a helpful description. A blank
           panel with no content is a defect.

        4. **Fieldset and legend visibility**: Fieldset borders with legend
           labels must be fully visible. Legend text must not be clipped or
           render as near-invisible against the border.

        5. **Stat/metric card label readability**: Value numbers must be
           clearly larger than their labels. Truncated labels without a
           tooltip are a defect.

        6. **Obvious layout defects**: Overflowing text, misaligned elements,
           overlapping UI, content bleeding outside its container.

        Note every issue you find before moving to Phase 2.

        ---

        ## Phase 2 — Interactive testing

        ## Getting started

        The app is running at `http://localhost:3000/ai-github-actions-playground/`
        with a seeded Elasticsearch cluster.

        1. `browser_navigate` to the app URL above.
        2. In the connection dialog, enter `http://localhost:9200` as the
           Elasticsearch URL, then click Connect.
        3. Navigate to "Add Data" from the sidebar. Use `browser_snapshot`
           after each wizard step and `browser_take_screenshot` to capture
           evidence, especially when command content changes.

        ---

        ## Visual quality checks

        On every run, check these visual quality dimensions:

        1. **Experience tile layout**: In Step 1, take a screenshot. Are the
           four experience tiles in a clean 2×2 grid? Is there sufficient
           spacing? Are icons, titles, and descriptions readable?

        2. **Technology card layout**: After clicking an experience tile, take
           a screenshot. Are the technology cards laid out as clean rows? Is
           there sufficient spacing between name, experience label, and
           summary text?

        3. **Collapsible section headers**: In Step 2, verify the accordion
           section headers are clearly labeled and the expand/collapse
           icons are visible.

        4. **Code block readability in dark mode**: Switch to dark mode
           before viewing Step 2 install commands. Take a screenshot. Is
           the monospace text readable? Does the code block background
           contrast with the paper background?

        5. **API key warning alert**: If you can generate an API key, is the
           orange/yellow warning alert ("Copy this API key now") visually
           distinct and readable?

        6. **CTA button row in Step 3**: Take a screenshot of the success
           step CTA buttons. Are they consistently sized? Is the primary CTA
           (e.g., "Open traces") visually distinct from outlined secondary
           CTAs?

        ---

        ## Output rules

        - **Complete ALL required exploration phases before filing an issue.**
          Do not stop after finding your first problem — continue through
          every required check listed above, collecting all findings.
          Treat example scenarios as illustrative, not an exhaustive checklist.
        - **Silence is better than noise.** Only file an issue for genuine
          bugs or defects. If everything works, do **not** open an issue.
        - Include any **axe-core color-contrast violations** found during
          exploration in the same issue, with page/location and screenshot.
        - Create **one** issue that lists **every** finding from your
          exploration. Use a numbered list — for each item include: the
          page/location, what you tried, what you expected, what actually
          happened, and a screenshot. A thorough issue typically has 3-10
          findings.
        - **Prompt accuracy**: If the UI differs from what this prompt
          describes (e.g., a title, label, or layout has changed) but the
          UI itself is fine, do NOT file that as a bug. Instead, add a
          **"Prompt Suggestions"** section at the end of your issue listing
          what this prompt should say instead to match the current UI.
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
