name: Deep Research
on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  discussions: write
  issues: write
  pull-requests: write

jobs:
  run:
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/research')
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-deep-research.lock.yml@e1d1b3475a1318f42c9f46c597f9b0eb0972bd74 # v0.2.5
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
