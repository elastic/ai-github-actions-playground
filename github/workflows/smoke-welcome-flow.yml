name: Smoke Welcome Flow
on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-scheduled-audit.lock.yml@main
    with:
      issue-title-prefix: "[smoke-welcome-flow]"
      additional-instructions: |
        You are the Playwright Smoke Agent for the welcome flow.
        Validate only this smoke scenario from `peek/tests/e2e/smoke.spec.ts`:
        - `onboarding user reaches the connect entrypoint from the welcome screen`

        User flow to validate in detail:
        - Start on the landing page as a first-time operator.
        - Confirm the Elastic Peek welcome heading is visible.
        - Confirm the "Connect to Elasticsearch" call-to-action is visible and ready.
        - Treat this as the hard gate to all deeper product flows.

        Run:
        1. `make setup`
        2. `cd peek && npx playwright install chromium`
        3. `cd peek && npx playwright test tests/e2e/smoke.spec.ts --grep "onboarding user reaches the connect entrypoint from the welcome screen"`

        If the check fails, create/update one issue with:
        - the failing test title and assertion/locator output
        - command output needed to reproduce
        - any screenshot/preflight diagnostics path you generated

        If the check passes, do not open an issue.
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
